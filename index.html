  const link = `https://douira.example/annonces/${l.id}`;
  const txt = `${l.title} (${l.area}, ${l.city}) · à partir de ${mad(pubPrice(l))} / ${UNIT_LABEL[tplOf(l).units[0]]}. Réservez en ligne : ${link}`;
  audit('Annonce partagée', l.title);
  openModal(`<h2>Partager l'annonce</h2><p class="small muted">Le lien et le message ne contiennent jamais l'adresse exacte ni le code d'accès.</p>

SPACE.t_payouts = () => {
  const n = new Date(); const list = S.bookings.filter(b => b.payout).sort((a, b) => new Date(a.payout.releaseAt) - new Date(b.payout.releaseAt));
  const due = list.filter(b => b.payout.status === 'programmé' && new Date(b.payout.releaseAt) <= n);
  const sum = arr => arr.reduce((s, b) => s + b.payout.amount, 0);
  return `${head('Versements aux propriétaires', `Règle : versement ${S.settings.payoutDelayHours} h après l'heure d'arrivée, commission déduite.`, `<button class="btn btn-p btn-s" data-act="runPayouts" ${due.length ? '' : 'disabled'}>Exécuter les ${due.length} versement(s) échu(s)</button>`)}

      <div class="prose"><p>Le principe s'inspire des grandes places de marché de location : le voyageur paie la totalité à la réservation, la plateforme conserve les fonds jusqu'au lendemain de l'arrivée, puis verse au propriétaire le montant de l'hébergement moins la commission. Le prix affiché aux voyageurs est le prix du propriétaire majoré de ${S.settings.markupPct} % ; ni le taux ni le prix du propriétaire ne leur sont montrés, et aucun frais n'est ajouté au paiement (frais de service à ${S.settings.serviceFeePct} %, réglables). La commission de ${S.settings.defaultCommission} % est prélevée sur le prix du propriétaire, ménage non compris. Le ménage est une offre facultative facturée au propriétaire (appartement ${mad(S.settings.cleaningTariff.apartments)}, villa ${mad(S.settings.cleaningTariff.villas)} par séjour) et déduite de son versement. Ce fonctionnement est propre à ce projet ; il ne reproduit ni les services ni les garanties d'une autre plateforme.</p>
      <p><b>À vérifier avec le prestataire de paiement :</b></p><ul><li>Le cadre juridique pour encaisser pour le compte des propriétaires et conserver les fonds jusqu'au versement</li><li>La page de paiement hébergée et 3-D Secure, pour ne jamais traiter de numéro de carte (périmètre PCI DSS réduit)</li><li>Les remboursements partiels par API, les délais et frais de virement aux propriétaires</li><li>L'acceptation des cartes étrangères, la devise et les règles de change</li><li>Les webhooks signés et l'idempotence pour éviter les doubles confirmations</li><li>Le contexte du marché : l'activité d'acquisition du CMI est transférée à des établissements de paiement agréés par Bank Al-Maghrib, à qui s'adresser pour le contrat commerçant</li></ul></div></section>

    <section class="panel stack"><h2>Protection de l'adresse et du code d'accès</h2><div class="prose"><ul>
      <li>Les coordonnées GPS et les liens Google Maps et Waze vers la porte suivent la même règle ; avant le paiement, l'annonce ne montre que le quartier</li>
      <li>Jamais affichés sur l'annonce, dans un lien partagé, dans les e-mails de l'équipe ou du propriétaire, ni dans le journal des e-mails</li>
      <li>Visibles par le client uniquement si sa réservation est confirmée et payée, depuis la confirmation (ou un délai paramétrable avant l'arrivée) jusqu'à son départ ; plus visibles après annulation</li>
      <li>Consultables par l'administrateur, le propriétaire du bien et les collaborateurs chargés de l'annonce, chaque affichage étant journalisé</li>
      <li>Chiffrés en base et déchiffrés au dernier moment côté serveur</li>

C.sort = el => go('search', Object.assign({}, R.p, { sort: el.value }));
C.bk = () => updateQuote();
C.filter = el => go('space', Object.assign({}, R.p, { tab: el.dataset.tab, [el.dataset.key]: el.value }));
C.editorCat = () => { const form = $('#lform'); const v = readListingForm(form); delete v.newCode; v.prices = {}; v.attrs = {}; v.amenities = []; R.p = Object.assign({}, R.p, { draft: v }); render(); };
C.permToggle = el => {
  if (!can('users.manage')) { el.checked = !el.checked; return toast('Action refusée.', true); }
  const pm = PERMS.find(x => x.k === el.dataset.k); if (!pm || pm.locked) return;
  S.collabPerms[pm.k] = el.checked; audit(`Permission collaborateur ${el.checked ? 'accordée' : 'retirée'} : ${pm.label}`, 'Collaborateurs'); render();
};
C.prereq = () => { const btn = $('#cat-confirm'); if (btn) btn.disabled = [...document.querySelectorAll('#modal-root [data-prereq]')].some(b => !b.checked); };

/* ---------- Délégation d'événements ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'bgClose') { if (e.target === el) closeModal(); return; }
  const fn = A[act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset, el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const fn = F[f.dataset.form]; if (fn) fn(Object.fromEntries(new FormData(f)), f);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && C[el.dataset.chg]) C[el.dataset.chg](el, e); });
document.addEventListener('input', e => { if (e.target.closest('[data-chg="bk"]')) updateQuote(); });



/* =====================================================================
   Avis, notes (5 étoiles) et label Diamond
   ===================================================================== */
const DIAMOND_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11l4 5.5L12 20.5 2.5 9z" fill="currentColor" opacity=".28"/><path d="M6.5 3.5h11l4 5.5L12 20.5 2.5 9zM2.5 9h19M9.5 3.5 8 9l4 11.5L16 9l-1.5-5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const reviewWindow = () => Number(S.settings.reviewWindowDays || 14);

function addReview({ bookingId, kind, rating, comment, authorId, at }) {
  const b = booking(bookingId), l = listing(b.listingId);
  const r = {
    id: uid('rv'), bookingId, listingId: l.id, kind, authorId: authorId || (kind === 'listing' ? b.clientId : l.ownerId),
    targetUserId: kind === 'client' ? b.clientId : l.ownerId, rating: Math.max(1, Math.min(5, Math.round(Number(rating)))),
    comment: comment || '', at: at || nowIso(), hidden: false
  };
  S.reviews.unshift(r); return r;
}
const reviewOf = (bookingId, kind) => S.reviews.find(r => r.bookingId === bookingId && r.kind === kind);
function reviewEligible(b, kind) {
  if (!b || b.status !== 'confirmed') return false;
  const end = checkoutDT(b), n = new Date();
  if (n < end || (n - end) / 864e5 > reviewWindow()) return false;
  return !reviewOf(b.id, kind);
}
function ratingOf(list) { const v = list.filter(r => !r.hidden); return v.length ? { avg: v.reduce((s, r) => s + r.rating, 0) / v.length, count: v.length } : { avg: 0, count: 0 }; }
const listingRating = id => ratingOf(S.reviews.filter(r => r.kind === 'listing' && r.listingId === id));
const clientRating = id => ratingOf(S.reviews.filter(r => r.kind === 'client' && r.targetUserId === id));
const ownerRating = id => ratingOf(S.reviews.filter(r => r.kind === 'listing' && r.targetUserId === id));
const fmtAvg = a => a.toFixed(1).replace('.', ',');
const starsHtml = (avg, size) => `<span class="stars${size ? ' ' + size : ''}" role="img" aria-label="${fmtAvg(avg)} sur 5"><i style="width:${Math.round(avg / 5 * 100)}%"></i></span>`;
const diamondBadge = () => `<span class="dia-badge">${DIAMOND_SVG}Diamond</span>`;
function ratingLine(l) {
  if (l.diamond) return diamondBadge();
  const r = listingRating(l.id);
  return r.count ? `<span class="row" style="gap:6px">${starsHtml(r.avg)} <b class="num">${fmtAvg(r.avg)}</b><span class="muted small">(${plural(r.count, 'avis', 'avis')})</span></span>` : '<span class="small muted">Nouveau sur Douira</span>';
}
function ratingInline(r, empty) { return r.count ? `${starsHtml(r.avg, 'sm')} <span class="small num">${fmtAvg(r.avg)} (${r.count})</span>` : `<span class="small muted">${empty || 'Pas encore noté'}</span>`; }
const clientRatingInline = id => ratingInline(clientRating(id));
function recoScore(l) { const r = listingRating(l.id); return (l.diamond ? 1000 : 0) + r.avg * 10 + Math.min(r.count, 20) * 0.1; }
function diamondBand() {
  return `<div class="dia-band dia-motif">${DIAMOND_SVG.replace('<svg ', '<svg class="big" ')}<div><span class="row" style="gap:8px">${diamondBadge()}<b>Sélection Diamond</b></span><span class="small">Ce bien fait partie des meilleurs logements de ${esc(S.settings.siteName)}. Il a été choisi par notre équipe pour la qualité de l'accueil, des équipements et des retours voyageurs.</span></div></div>`;
}
function diamondSection() {
  const list = publicListings().filter(l => l.diamond);
  if (!list.length) return '';
  return `<section class="sec gutter dia-sec dia-motif"><div class="wrap stack">
    <div class="head"><div class="stack-s" style="gap:4px"><span class="row" style="gap:8px">${diamondBadge()}<span class="eyebrow">Sélection</span></span><h2>Nos biens Diamond</h2><p class="small muted">Les meilleurs appartements et villas, choisis un par un par notre équipe.</p></div>
    <button class="btn btn-g btn-s" data-act="go" data-to="search" data-diamond="1">Voir tous les biens Diamond</button></div>
    <div class="lgrid">${list.map(lcard).join('')}</div></div></section>`;
}
function reviewsSection(l) {
  const list = S.reviews.filter(r => r.kind === 'listing' && r.listingId === l.id && !r.hidden);
  const r = listingRating(l.id);
  return `<div class="stack"><div class="row between"><h3>Avis des voyageurs</h3>${l.diamond ? diamondBadge() : (r.count ? `<span class="row" style="gap:6px">${starsHtml(r.avg, 'lg')} <b class="num" style="font-size:1.1rem">${fmtAvg(r.avg)}</b> <span class="muted">· ${plural(r.count, 'avis', 'avis')}</span></span>` : '')}</div>
    ${list.length ? `<div class="rgrid">${list.slice(0, 6).map(x => `<div class="review"><div class="row" style="gap:8px"><b>${esc(firstName((user(x.authorId) || {}).name || 'Voyageur'))}</b><span class="small muted">${new Date(x.at).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}</span>${l.diamond ? '' : starsHtml(x.rating, 'sm')}</div><p>${esc(x.comment)}</p></div>`).join('')}</div>`
      : '<p class="muted small">Pas encore d\'avis. Seuls les voyageurs ayant séjourné peuvent en publier un.</p>'}</div>`;
}
function reviewCard(x, opts = {}) {
  const b = booking(x.bookingId), l = listing(x.listingId), au = user(x.authorId), tg = user(x.targetUserId);
  const what = x.kind === 'listing' ? `Avis sur « ${esc(l.title)} »` : `Avis sur le voyageur ${esc(tg ? tg.name : '—')}`;
  return `<div class="review${x.hidden ? ' hidden' : ''}"><div class="row" style="gap:8px">${starsHtml(x.rating, 'sm')}<b>${what}</b>${x.hidden ? '<span class="pill">Masqué</span>' : ''}</div>
    <span class="small muted">Par ${esc(au ? au.name : '—')} · séjour ${esc(b ? b.ref : '')} · ${fmtDT(x.at)}</span><p>${esc(x.comment)}</p>
    ${opts.moderate ? `<div><button class="btn btn-g btn-s" data-act="reviewToggle" data-id="${x.id}">${x.hidden ? 'Réafficher' : 'Masquer'}</button></div>` : ''}</div>`;
}
function reviewModal(b, kind) {
  const l = listing(b.listingId), c = user(b.clientId);
  const title = kind === 'listing' ? `Votre avis sur « ${l.title} »` : `Noter le voyageur ${c.name}`;
  openModal(`<h2>${esc(title)}</h2>
    <p class="small muted">Séjour ${esc(b.ref)} du ${fmtD(b.start)} au ${fmtD(b.end)}. ${kind === 'client' ? "Cet avis est visible par l'équipe, par les hôtes qui recevront ce voyageur et par le voyageur lui-même. Il n'est pas publié sur le site." : 'Votre avis sera publié sur l\'annonce avec votre prénom.'}</p>
    <form class="stack" data-form="reviewSave" data-id="${b.id}" data-kind="${kind}">
      <fieldset style="border:0;padding:0" class="stack-s"><legend style="padding:0;font-size:.84rem">Note sur 5</legend><div class="rate">${[5, 4, 3, 2, 1].map(n => `<input type="radio" name="rating" id="rt-${n}" value="${n}" required><label for="rt-${n}" aria-label="${plural(n, 'étoile')}" title="${plural(n, 'étoile')}">★</label>`).join('')}</div></fieldset>
      ${field('Commentaire', `<textarea name="comment" id="rv-comment" required minlength="10" maxlength="1000" placeholder="${kind === 'listing' ? "Propreté, emplacement, accueil, conformité à l'annonce…" : 'Respect du logement et du règlement, communication, ponctualité…'}"></textarea>`)}
      <div class="row"><button class="btn btn-p" type="submit">Publier l'avis</button><button type="button" class="btn btn-g" data-act="closeModal">Annuler</button></div></form>`);
}
const reviewBtn = (b, kind, label, cls = 'btn btn-p btn-s') => `<button class="${cls}" data-act="reviewOpen" data-id="${b.id}" data-kind="${kind}">${label}</button>`;

/* ---------- Panneaux dans les fiches existantes ---------- */
function clientReviewPanel(b) {
  const mine = reviewOf(b.id, 'listing'), got = reviewOf(b.id, 'client');
  if (!mine && !got && !reviewEligible(b, 'listing')) return '';
  return `<div class="panel stack"><h3>Avis</h3>
    ${mine ? reviewCard(mine) : reviewEligible(b, 'listing') ? `<p class="small muted">Votre séjour est terminé. Vous avez ${reviewWindow()} jours après le départ pour publier votre avis.</p><div>${reviewBtn(b, 'listing', 'Laisser un avis')}</div>` : ''}
    ${got && !got.hidden ? reviewCard(got) : ''}</div>`;
}
function teamReviewPanel(b) {
  if (b.status !== 'confirmed' || new Date() < checkoutDT(b)) return '';
  const lr = reviewOf(b.id, 'listing'), cr = reviewOf(b.id, 'client'), mod = can('reviews.manage');
  return `<div class="panel stack"><div class="panel-h" style="margin:0"><h3>Avis du séjour</h3>${!cr && mod && reviewEligible(b, 'client') ? reviewBtn(b, 'client', 'Noter le voyageur') : ''}</div>
    ${lr ? reviewCard(lr, { moderate: mod }) : '<p class="small muted">Le voyageur n\'a pas encore donné son avis.</p>'}
    ${cr ? reviewCard(cr, { moderate: mod }) : '<p class="small muted">Le voyageur n\'a pas encore été noté.</p>'}</div>`;
}

/* ---------- Espace client : Mes avis ---------- */
SPACE.c_reviews = () => {
  const u = me(), mine = S.bookings.filter(b => b.clientId === u.id);
  const todo = mine.filter(b => reviewEligible(b, 'listing'));
  const given = S.reviews.filter(r => r.kind === 'listing' && r.authorId === u.id);
  const got = S.reviews.filter(r => r.kind === 'client' && r.targetUserId === u.id && !r.hidden);
  const gr = clientRating(u.id);
  return `${head('Mes avis', 'Notez les logements où vous avez séjourné. Les hôtes vous notent aussi, ce qui facilite vos prochaines réservations.')}
    ${todo.length ? `<div class="panel stack"><h3>À noter</h3>${todo.map(b => `<div class="row between"><span>${esc(listing(b.listingId).title)} <span class="small muted">· départ le ${fmtD(b.end)}</span></span>${reviewBtn(b, 'listing', 'Laisser un avis')}</div>`).join('')}</div>` : ''}
    <div class="two"><div class="panel stack"><h3>Avis que j'ai publiés</h3>${given.map(r => reviewCard(r)).join('') || '<p class="small muted">Aucun avis pour le moment.</p>'}</div>
    <div class="panel stack"><div class="row between"><h3>Avis reçus des hôtes</h3>${gr.count ? `<span>${starsHtml(gr.avg)} <b class="num">${fmtAvg(gr.avg)}</b></span>` : ''}</div>${got.map(r => reviewCard(r)).join('') || '<p class="small muted">Vous n\'avez pas encore été noté.</p>'}</div></div>`;
};

/* ---------- Espace propriétaire : Avis et notes ---------- */
SPACE.o_bookings = () => {
  const bs = ownerBookings();
  return `${head('Réservations', "Vous voyez le prénom, l'initiale et la note des voyageurs. Leurs coordonnées complètes restent gérées par l'équipe.")}
    ${table(['Réf.', 'Bien', 'Voyageur', 'Note voyageur', 'Dates', 'Statut', '>Net', ''], bs.map(b => `<tr><td class="mono">${esc(b.ref)}</td><td>${esc(listing(b.listingId).title)}</td><td>${esc(shortName(user(b.clientId).name))}, ${b.guests} pers.</td><td>${clientRatingInline(b.clientId)}</td><td class="num" style="white-space:nowrap">${fmtD(b.start)} → ${fmtD(b.end)}</td><td>${pill(displayStatus(b))}</td><td class="r">${mad(b.payout.amount)}</td><td>${reviewEligible(b, 'client') ? reviewBtn(b, 'client', 'Noter') : ''}</td></tr>`), 'Aucune réservation.')}`;
};
SPACE.o_reviews = () => {
  const u = me(), ls = ownerListings(), bs = ownerBookings();
  const todo = bs.filter(b => reviewEligible(b, 'client'));
  const onMine = S.reviews.filter(r => r.kind === 'listing' && r.targetUserId === u.id && !r.hidden);
  const given = S.reviews.filter(r => r.kind === 'client' && r.authorId === u.id);
  return `${head('Avis et notes', 'Les voyageurs notent vos biens après leur séjour ; vous pouvez noter chaque voyageur de 1 à 5 étoiles.')}
    ${todo.length ? `<div class="panel stack"><h3>Voyageurs à noter</h3>${todo.map(b => `<div class="row between"><span>${esc(shortName(user(b.clientId).name))} · ${esc(listing(b.listingId).title)} <span class="small muted">· départ le ${fmtD(b.end)}</span></span>${reviewBtn(b, 'client', 'Noter le voyageur')}</div>`).join('')}<p class="small muted">Vous disposez de ${reviewWindow()} jours après chaque départ.</p></div>` : ''}
    ${table(['Bien', 'Note moyenne', 'Label'], ls.map(l => { const r = listingRating(l.id); return `<tr><td>${esc(l.title)}</td><td>${ratingInline(r, 'Aucun avis')}</td><td>${l.diamond ? diamondBadge() : '<span class="small muted">—</span>'}</td></tr>`; }), 'Aucun bien.')}
    <p class="small muted">Sur le site, les biens Diamond affichent le label Diamond à la place des étoiles. Les notes restent visibles ici pour votre suivi.</p>
    <div class="two"><div class="panel stack"><h3>Avis sur mes biens</h3>${onMine.map(r => reviewCard(r)).join('') || '<p class="small muted">Aucun avis.</p>'}</div>
    <div class="panel stack"><h3>Mes avis sur les voyageurs</h3>${given.map(r => reviewCard(r)).join('') || '<p class="small muted">Aucun avis.</p>'}</div></div>`;
};

/* ---------- Espace équipe : Avis et notes ---------- */
SPACE.t_reviews = p => {
  const kind = p.kind || '';
  const list = S.reviews.filter(r => !kind || r.kind === kind);
  const all = ratingOf(S.reviews.filter(r => r.kind === 'listing'));
  const todo = S.bookings.filter(b => reviewEligible(b, 'client'));
  return `${head('Avis et notes', 'Avis des voyageurs sur les biens et des hôtes sur les voyageurs. Un avis masqué ne compte plus dans les moyennes.')}
    <div class="kpis">${kpi('Note moyenne des biens', all.count ? fmtAvg(all.avg) + ' / 5' : '—', plural(all.count, 'avis publié', 'avis publiés'))}${kpi('Biens Diamond', S.listings.filter(l => l.diamond).length, can('listings.diamond') ? 'à gérer depuis « Annonces »' : 'attribués par l\'administrateur')}${kpi('Avis masqués', S.reviews.filter(r => r.hidden).length)}${kpi('Voyageurs à noter', todo.length)}</div>
    ${todo.length ? `<div class="panel stack"><h3>Voyageurs à noter</h3><p class="small muted">Si l'hôte ne note pas le voyageur, l'équipe peut le faire à sa place.</p>${todo.map(b => `<div class="row between"><span>${esc(user(b.clientId).name)} · ${esc(listing(b.listingId).title)} <span class="small muted">· ${esc(b.ref)}, départ le ${fmtD(b.end)}</span></span>${reviewBtn(b, 'client', 'Noter le voyageur', 'btn btn-g btn-s')}</div>`).join('')}</div>` : ''}
    <div class="panel"><div class="panel-h"><h3>Classement des biens</h3></div>${table(['Bien', 'Catégorie', 'Note', 'Label', ''], S.listings.filter(l => l.status === 'published').sort((a, b) => recoScore(b) - recoScore(a)).map(l => `<tr><td>${esc(l.title)}<div class="small muted">${esc(l.city)}</div></td><td>${esc(category(l.categoryId).name)}</td><td>${ratingInline(listingRating(l.id), 'Aucun avis')}</td><td>${l.diamond ? diamondBadge() : '—'}</td><td>${can('listings.diamond') ? `<button class="btn btn-g btn-s" data-act="diamondToggle" data-id="${l.id}">${l.diamond ? 'Retirer Diamond' : 'Passer en Diamond'}</button>` : ''}</td></tr>`), '')}</div>
    <div class="filters"><select id="rv-k" data-chg="filter" data-tab="t_reviews" data-key="kind">${opt('', 'Tous les avis', kind)}${opt('listing', 'Avis sur les biens', kind)}${opt('client', 'Avis sur les voyageurs', kind)}</select></div>
    <div class="panel stack">${list.map(r => reviewCard(r, { moderate: true })).join('') || '<p class="muted">Aucun avis.</p>'}</div>`;
};

/* ---------- Actions ---------- */
A.reviewOpen = d => {
  const b = booking(d.id), u = me(); if (!b || !u) return;
  const kind = d.kind === 'client' ? 'client' : 'listing';
  const allowed = kind === 'listing' ? b.clientId === u.id : (listing(b.listingId).ownerId === u.id || can('reviews.manage'));
  if (!allowed) return toast('Action non autorisée.', true);
  if (!reviewEligible(b, kind)) return toast(`L'avis n'est possible qu'après le départ, pendant ${reviewWindow()} jours, une seule fois.`, true);
  reviewModal(b, kind);
};
F.reviewSave = (data, form) => {
  const b = booking(form.dataset.id), kind = form.dataset.kind, u = me(); if (!b || !u) return;
  const allowed = kind === 'listing' ? b.clientId === u.id : (listing(b.listingId).ownerId === u.id || can('reviews.manage'));
  if (!allowed || !reviewEligible(b, kind)) return toast('Avis impossible pour ce séjour.', true);
  if (!data.rating) return toast('Choisissez une note de 1 à 5 étoiles.', true);
  if ((data.comment || '').trim().length < 10) return toast('Écrivez un commentaire d\'au moins 10 caractères.', true);
  addReview({ bookingId: b.id, kind, rating: data.rating, comment: data.comment.trim(), authorId: u.id });
  audit(kind === 'listing' ? 'Avis publié sur un bien' : 'Voyageur noté', b.ref);
  closeModal(); toast('Merci, votre avis est publié.'); render();
};
A.reviewToggle = d => {
  if (!guard('reviews.manage')) return; const r = S.reviews.find(x => x.id === d.id);
  r.hidden = !r.hidden; r.moderatedBy = S.session.userId; r.moderatedAt = nowIso();
  audit(r.hidden ? 'Avis masqué' : 'Avis réaffiché', (booking(r.bookingId) || {}).ref || '—'); toast(r.hidden ? 'Avis masqué.' : 'Avis réaffiché.'); render();
};
A.diamondToggle = d => {
  if (!guard('listings.diamond')) return; const l = listing(d.id), r = listingRating(l.id);
  if (l.diamond) return openModal(`<h2>Retirer le label Diamond ?</h2><p>« ${esc(l.title)} » affichera de nouveau sa note en étoiles${r.count ? ` (${fmtAvg(r.avg)} / 5)` : ''}.</p><div class="row"><button class="btn btn-d" data-act="diamondSet" data-id="${l.id}" data-on="0">Retirer</button><button class="btn btn-g" data-act="closeModal">Annuler</button></div>`);
  openModal(`<h2>Passer « ${esc(l.title)} » en Diamond ?</h2>${diamondBand()}
    <dl class="kv"><dt>Note actuelle</dt><dd>${ratingInline(r, 'Aucun avis')}</dd><dt>Statut</dt><dd>${LISTING_STATUS[l.status][0]}</dd></dl>
    <p class="small muted">Sur le site, le label Diamond remplace les étoiles et le bien apparaît en tête des résultats et dans la sélection Diamond de l'accueil. Votre choix est enregistré dans le journal d'audit.</p>
    <div class="row"><button class="btn btn-p" data-act="diamondSet" data-id="${l.id}" data-on="1">Attribuer le label Diamond</button><button class="btn btn-g" data-act="closeModal">Annuler</button></div>`);
};
A.diamondSet = d => {
  if (!guard('listings.diamond')) return; const l = listing(d.id);
  if (d.on === '1') { l.diamond = { at: nowIso(), by: S.session.userId }; audit('Label Diamond attribué', l.title); toast(`« ${l.title} » est maintenant Diamond.`); }
  else { l.diamond = null; audit('Label Diamond retiré', l.title); toast('Label Diamond retiré.'); }
  closeModal(); render();
};
A.searchDiamond = () => go('search', Object.assign({}, R.p, { diamond: R.p.diamond === '1' ? '' : '1' }));
C.diamondRight = el => {
  if (!can('users.manage')) { el.checked = !el.checked; return toast('Action refusée.', true); }
  const u = user(el.dataset.id); u.diamondRight = el.checked;
  audit(`Droit Diamond ${el.checked ? 'accordé à' : 'retiré à'} ${u.name}`, 'Collaborateurs'); toast(el.checked ? `${u.name} peut attribuer le label Diamond.` : `${u.name} ne peut plus attribuer le label Diamond.`); render();
};


/* =====================================================================
   Localisation (Google Maps, Waze) et favoris / voyages planifiés
   ===================================================================== */
const PIN_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9.5" r="2.5" fill="currentColor"/></svg>';
const ROUTE_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c4-1 3-6 7-7s4-6 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.5 2.5"/><circle cx="5" cy="19" r="2" fill="currentColor"/><circle cx="19" cy="5" r="2" fill="currentColor"/></svg>';
const HEART_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.9 4.5 7.3 4.5c2 0 3.6 1.1 4.7 2.8 1.1-1.7 2.7-2.8 4.7-2.8 3.4 0 5.7 3.3 4.5 6.7-1.7 4.7-9.2 9.3-9.2 9.3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';

const gmapsPlace = g => `https://www.google.com/maps/search/?api=1&query=${g.lat},${g.lng}`;
const gmapsDir = g => `https://www.google.com/maps/dir/?api=1&destination=${g.lat},${g.lng}`;
const wazeNav = g => `https://waze.com/ul?ll=${g.lat},${g.lng}&navigate=yes`;
const areaQuery = l => `${l.area}, ${l.city}, Maroc`;
const gmapsArea = l => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(areaQuery(l))}`;
const wazeArea = l => `https://waze.com/ul?q=${encodeURIComponent(l.area + ' ' + l.city)}`;
const extLink = (href, icon, label) => `<a class="btn btn-g btn-s" href="${esc(href)}" target="_blank" rel="noopener">${icon}${esc(label)}</a>`;
/* exact = true : position précise du bien. Réservé au client dont le paiement est confirmé, au propriétaire et à l'équipe. */
function mapLinks(l, exact) {
  if (exact && l.geo) return `<div class="row maplinks">${extLink(gmapsPlace(l.geo), PIN_SVG, 'Google Maps')}${extLink(gmapsDir(l.geo), ROUTE_SVG, 'Itinéraire')}${extLink(wazeNav(l.geo), ROUTE_SVG, 'Waze')}</div><span class="small muted mono">${l.geo.lat.toFixed(5)}, ${l.geo.lng.toFixed(5)}</span>`;
  if (exact) return '<span class="small muted">Coordonnées GPS non renseignées.</span>';
  return `<div class="row maplinks">${extLink(gmapsArea(l), PIN_SVG, 'Quartier sur Google Maps')}${extLink(wazeArea(l), ROUTE_SVG, 'Quartier sur Waze')}</div>`;
}
function parseGeo(lat, lng) {
  const a = String(lat ?? '').trim().replace(',', '.'), b = String(lng ?? '').trim().replace(',', '.');
  if (!a && !b) return null;
  const x = Number(a), y = Number(b);
  if (!a || !b || isNaN(x) || isNaN(y) || x < 20 || x > 36.5 || y < -17.5 || y > -0.9) return 'invalid';
  return { lat: x, lng: y };
}
/* Le client voit la position exacte s'il a une réservation payée en cours de validité pour ce bien. */
function clientExactAccess(l) {
  const u = me(); if (!u || u.role !== 'client') return null;
  return S.bookings.find(b => b.listingId === l.id && b.clientId === u.id && accessState(b).ok) || null;
}
function locationSection(l) {
  const own = me() && ((me().role === 'owner' && l.ownerId === me().id) || isTeam());
  const bk = clientExactAccess(l);
  return `<div class="stack-s"><h3>Emplacement</h3>
    <p>${esc(l.area)}, ${esc(l.city)}</p>
    ${bk || own ? `<p class="small">${bk ? `Position exacte de votre logement (réservation ${esc(bk.ref)}) :` : 'Position exacte (visible par vous, pas par les visiteurs) :'}</p>${mapLinks(l, true)}`
      : `${mapLinks(l, false)}<p class="small muted">La position exacte, avec l'itinéraire Google Maps et Waze jusqu'à la porte, est envoyée au voyageur dès la confirmation de son paiement, avec l'adresse et le code d'accès.</p>`}</div>`;
}

/* ---------- Favoris ---------- */
let pendingFav = null;
const myLists = () => { const u = me(); return u ? S.favLists.filter(f => f.userId === u.id) : []; };
const isFav = id => myLists().some(f => f.items.some(i => i.listingId === id));
const favCount = () => new Set(myLists().flatMap(f => f.items.map(i => i.listingId))).size;
function heartBtn(l) { const on = role() === 'client' && isFav(l.id); return `<button class="heart" data-act="favOpen" data-id="${l.id}" aria-pressed="${on}" aria-label="${on ? 'Modifier mes favoris' : 'Enregistrer dans mes favoris'}" title="${on ? 'Dans vos favoris' : 'Enregistrer'}">${HEART_SVG}</button>`; }
function favInlineBtn(l) { const on = role() === 'client' && isFav(l.id); return `<button class="btn btn-g btn-s favbtn" data-act="favOpen" data-id="${l.id}" aria-pressed="${on}">${HEART_SVG}${on ? 'Dans vos favoris' : 'Enregistrer'}</button>`; }
function favHeaderBtn() { const n = favCount(); return `<button class="btn btn-g btn-s favbtn" data-act="go" data-to="space" data-tab="c_favs" aria-pressed="${n > 0}">${HEART_SVG}Favoris${n ? ` <span class="num">(${n})</span>` : ''}</button>`; }
function favModal(id) {
  const l = listing(id), lists = myLists();
  openModal(`<h2>Enregistrer « ${esc(l.title)} »</h2>
    <form class="stack" data-form="favSave" data-id="${l.id}">
      ${lists.length ? `<div class="stack-s"><span class="eyebrow">Mes listes</span>${lists.map(f => `<label class="check"><input type="checkbox" name="lists" value="${f.id}"${f.items.some(i => i.listingId === id) ? ' checked' : ''}> <span>${esc(f.name)} <span class="small muted">· ${plural(f.items.length, 'bien')}${f.start ? ` · du ${fmtD(f.start)} au ${fmtD(f.end)}` : ''}</span></span></label>`).join('')}</div>` : ''}
      ${field(lists.length ? 'Ou créer une nouvelle liste' : 'Nom de votre liste', `<input name="newName" id="fv-new" maxlength="60" placeholder="Ex. Été à Marrakech, Week-end en famille…" value="${lists.length ? '' : 'Mes favoris'}">`)}
      <div class="row"><button class="btn btn-p" type="submit">Enregistrer</button><button type="button" class="btn btn-g" data-act="closeModal">Annuler</button></div></form>`);
}
function newList(name) { const f = { id: uid('fv'), userId: me().id, name: name.slice(0, 60), start: '', end: '', guests: 2, budget: '', notes: '', createdAt: nowIso(), items: [] }; S.favLists.push(f); return f; }

SPACE.c_favs = p => {
  const lists = myLists();
  return `${head('Favoris et voyages', 'Rangez vos logements préférés dans des listes, donnez-leur le nom que vous voulez et préparez vos prochains voyages : dates, nombre de voyageurs, budget, notes.', '<button class="btn btn-p btn-s" data-act="favListNew">Nouvelle liste</button>')}
    ${lists.length ? lists.map(f => favListHtml(f, p.open === f.id)).join('') : `<div class="empty stack-s" style="align-items:center"><p>Vous n'avez pas encore de favoris.</p><p class="small">Touchez le cœur sur un logement pour l'enregistrer.</p>${btnGo('Parcourir les logements', 'search', {}, 'btn btn-p btn-s')}</div>`}`;
};
function favListHtml(f, editing) {
  const planned = f.start && f.end && diffDays(f.start, f.end) > 0;
  const days = planned ? diffDays(isoD(today()), f.start) : null;
  const items = f.items.map(it => ({ it, l: listing(it.listingId) })).filter(x => x.l);
  const rows = items.map(({ it, l }) => {
    const live = l.status === 'published' && (category(l.categoryId) || {}).active;
    let state = '', q = null, avail = false;
    if (!live) state = pill(['Plus disponible', 'bad']);
    else if (planned) {
      q = quote(l, f.start, f.end, Number(f.guests || 1));
      if (parseD(f.start) < today()) state = pill(['Dates passées', '']);
      else if (Number(f.guests) > l.capacity) state = pill([`${l.capacity} voyageurs max.`, 'warn']);
      else if (!isAvailable(l.id, f.start, f.end)) state = pill(['Indisponible à ces dates', 'bad']);
      else { state = pill(['Disponible', 'ok']); avail = true; }
    }
    const ok = live && avail;
    const budget = Number(f.budget || 0);
    return `<div class="item"><img class="thumb" style="width:100%;height:auto;aspect-ratio:4/3" src="${lphoto(l, 0)}" alt="">
      <div class="stack-s" style="gap:3px;min-width:0"><b>${esc(l.title)}</b><span class="small muted">${esc(l.area)}, ${esc(l.city)} · ${esc(category(l.categoryId).name)}</span><span class="small">${ratingLine(l)}</span>
        <span class="row small" style="gap:8px">${state}${q ? `<b class="num">${mad(q.total)}</b> <span class="muted">pour ${plural(q.qty, 'nuit')}</span>${budget ? (q.total <= budget ? ' <span class="pill ok">Dans le budget</span>' : ` <span class="pill warn">+${mad(q.total - budget)} sur le budget</span>`) : ''}` : `<span class="muted">${mad(pubPrice(l))} / ${UNIT_LABEL[tplOf(l).units[0]]}</span>`}</span></div>
      <div class="row acts" style="gap:6px">${live ? (ok ? btnGo('Réserver', 'listing', { id: l.id, start: f.start, end: f.end, guests: f.guests }, 'btn btn-p btn-s') : btnGo('Voir', 'listing', { id: l.id })) : ''}${extLink(gmapsArea(l), PIN_SVG, 'Carte')}<button class="btn btn-g btn-s" data-act="favRemove" data-list="${f.id}" data-id="${l.id}">Retirer</button></div></div>`;
  }).join('');
  const shareTxt = `${f.name}${planned ? ` (du ${fmtD(f.start)} au ${fmtD(f.end)}, ${f.guests} voyageurs)` : ''}\n` + items.map(({ l }) => `• ${l.title} (${l.city}) : https://douira.example/annonces/${l.id}`).join('\n');
  return `<section class="panel stack favlist">
    <div class="row between"><div class="stack-s" style="gap:2px"><h2 style="font-size:1.4rem">${esc(f.name)}</h2>
      <span class="small muted">${plural(items.length, 'logement')}${planned ? ` · du ${fmtD(f.start)} au ${fmtD(f.end)} · ${plural(Number(f.guests), 'voyageur')}${f.budget ? ' · budget ' + mad(f.budget) : ''}` : ' · voyage pas encore planifié'}</span>
      ${planned && days >= 0 ? `<span class="pill acc" style="align-self:flex-start">${days === 0 ? 'Départ aujourd\'hui' : `Départ dans ${plural(days, 'jour')}`}</span>` : ''}</div>
      <div class="row" style="gap:6px"><button class="btn btn-g btn-s" data-act="favEdit" data-id="${f.id}" aria-expanded="${!!editing}">${planned ? 'Modifier le voyage' : 'Planifier ce voyage'}</button>${items.length ? copyBtn(shareTxt, 'Copier la liste') : ''}<button class="btn btn-d btn-s" data-act="favListDelete" data-id="${f.id}">Supprimer</button></div></div>
    ${editing ? `<form class="fgrid" data-form="favPlan" data-id="${f.id}" style="background:var(--surface-2);padding:14px;border-radius:10px">
      ${field('Nom de la liste', `<input name="name" id="fp-name-${f.id}" required maxlength="60" value="${esc(f.name)}">`, '', 'full')}
      ${field('Arrivée', `<input type="date" name="start" id="fp-s-${f.id}" min="${isoD(today())}" value="${esc(f.start)}">`)}
      ${field('Départ', `<input type="date" name="end" id="fp-e-${f.id}" min="${isoD(addDays(today(), 1))}" value="${esc(f.end)}">`)}
      ${field('Voyageurs', `<input type="number" name="guests" id="fp-g-${f.id}" min="1" max="20" value="${esc(f.guests || 2)}">`)}
      ${field('Budget total (MAD, facultatif)', `<input type="number" name="budget" id="fp-b-${f.id}" min="0" step="100" value="${esc(f.budget)}">`)}
      ${field('Notes de voyage', `<textarea name="notes" id="fp-n-${f.id}" placeholder="Vols, activités, idées de restaurants…">${esc(f.notes)}</textarea>`, '', 'full')}
      <div class="row full"><button class="btn btn-p btn-s" type="submit">Enregistrer</button><button type="button" class="btn btn-g btn-s" data-act="favEdit" data-id="${f.id}">Fermer</button></div></form>` : (f.notes ? `<p class="small" style="white-space:pre-line">${esc(f.notes)}</p>` : '')}
    ${planned ? '<p class="small muted">Disponibilités et prix calculés pour vos dates. Rien n\'est bloqué tant que vous n\'avez pas réservé et payé.</p>' : ''}
    ${rows || '<p class="small muted">Cette liste est vide. Touchez le cœur sur un logement pour l\'y ajouter.</p>'}</section>`;
}

/* ---------- Actions ---------- */
A.favOpen = d => {
  const u = me();
  if (!u) { pendingFav = d.id; return openModal(bookAuthModal().replace('Connectez-vous pour réserver', 'Connectez-vous pour enregistrer vos favoris').replace('Créer mon compte et continuer', 'Créer mon compte')); }
  if (u.role !== 'client') return toast('Les favoris sont réservés aux comptes clients.', true);
  favModal(d.id);
};
F.favSave = (data, form) => {
  const u = me(); if (!u || u.role !== 'client') return;
  const id = form.dataset.id, fd = new FormData(form), chosen = fd.getAll('lists');
  myLists().forEach(f => {
    const has = f.items.some(i => i.listingId === id);
    if (chosen.includes(f.id) && !has) f.items.push({ listingId: id, addedAt: nowIso() });
    if (!chosen.includes(f.id) && has) f.items = f.items.filter(i => i.listingId !== id);
  });
  const name = (data.newName || '').trim();
  if (name) newList(name).items.push({ listingId: id, addedAt: nowIso() });
  closeModal(); toast(isFav(id) ? 'Favoris mis à jour.' : 'Retiré de vos favoris.'); render();
};
A.favListNew = () => openModal(`<h2>Nouvelle liste</h2><form class="stack" data-form="favListCreate">${field('Nom de la liste', '<input name="name" id="fl-name" required maxlength="60" placeholder="Ex. Vacances d\'été, Voyage d\'affaires à Rabat…">')}<div class="row"><button class="btn btn-p" type="submit">Créer</button><button type="button" class="btn btn-g" data-act="closeModal">Annuler</button></div></form>`);
F.favListCreate = data => { if (role() !== 'client') return; const f = newList(data.name.trim() || 'Mes favoris'); closeModal(); toast(`Liste « ${f.name} » créée.`); go('space', { tab: 'c_favs', open: f.id }); };
A.favEdit = d => go('space', { tab: 'c_favs', open: R.p.open === d.id ? '' : d.id });
F.favPlan = (data, form) => {
  const f = S.favLists.find(x => x.id === form.dataset.id); if (!f || f.userId !== S.session.userId) return;
  if ((data.start && !data.end) || (!data.start && data.end)) return toast('Indiquez les deux dates, ou aucune.', true);
  if (data.start && diffDays(data.start, data.end) < 1) return toast('La date de départ doit suivre la date d\'arrivée.', true);
  Object.assign(f, { name: data.name.trim().slice(0, 60) || f.name, start: data.start, end: data.end, guests: Math.max(1, Number(data.guests || 1)), budget: data.budget ? Number(data.budget) : '', notes: data.notes || '' });
  toast('Voyage enregistré.'); go('space', { tab: 'c_favs' });
};
A.favRemove = d => { const f = S.favLists.find(x => x.id === d.list); if (!f || f.userId !== S.session.userId) return; f.items = f.items.filter(i => i.listingId !== d.id); toast('Retiré de la liste.'); render(); };
A.favListDelete = d => { const f = S.favLists.find(x => x.id === d.id); if (!f) return; openModal(`<h2>Supprimer la liste « ${esc(f.name)} » ?</h2><p>Les ${plural(f.items.length, 'logement')} qu'elle contient ne seront pas supprimés du site, seulement de cette liste.</p><div class="row"><button class="btn btn-d" data-act="favListDeleteConfirm" data-id="${f.id}">Supprimer</button><button class="btn btn-g" data-act="closeModal">Annuler</button></div>`); };
A.favListDeleteConfirm = d => { S.favLists = S.favLists.filter(x => !(x.id === d.id && x.userId === S.session.userId)); closeModal(); toast('Liste supprimée.'); render(); };

/* Coordonnées GPS : contrôle à l'enregistrement d'une annonce */
const _listingSave = F.listingSave;
F.listingSave = (data, form) => {
  if (parseGeo(data.lat, data.lng) === 'invalid') return toast('Coordonnées GPS invalides : indiquez la latitude et la longitude du bien au Maroc (ex. 31.63700 et -8.01050).', true);

};

/* ---------- Illustrations de scènes (aucune image externe) ---------- */
function rnd(seed) { let s = seed * 9301 + 49297; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
function ridge(r, W, base, amp, step) { let d = `M0 ${base}`; for (let x = 0; x <= W; x += step) d += ` L${x} ${(base - amp * (0.35 + 0.65 * r())).toFixed(1)}`; return d + ` L${W} 900 L0 900 Z`; }
const sceneCache = {};
function scene(kind, seed, W = 1600, H = 760) {
  const key = kind + seed + W + H; if (sceneCache[key]) return sceneCache[key];
  const r = rnd(seed);
  const P = {
    dusk: ['#1E2A55', '#7A4B78', '#E58F63', '#F6C77D', '#5E4A6E', '#3C2E4A', '#1C1626'],
    marrakech: ['#F3B77B', '#E98C5C', '#F7D3A0', '#FFF0C8', '#B86A4C', '#8C4A36', '#4A2A22'],
    coast: ['#7FB6D5', '#B9D8E6', '#F2E6CF', '#FFFFFF', '#5C8FA8', '#3E6E86', '#22465A'],
    rabat: ['#9CC3D8', '#D6E6EC', '#F1E2C8', '#FFF7E6', '#C9A27A', '#A9805A', '#5B4434'],
    beach: ['#86C5E0', '#CBE7F1', '#F5E3BE', '#FFF6DC', '#6FA6BE', '#E3C28E', '#B8935E'],
    ochre: ['#F0C27A', '#D9925A', '#F7DDB0', '#FFF2D2', '#A26A3E', '#7A4B2C', '#3E2618']
  }[kind] || [];
  const [s1, s2, s3, sun, m1, m2, fg] = P;
  const coastal = kind === 'coast' || kind === 'beach';
  let city = '';
  let x = 40 + r() * 60;
  while (x < W) { const w = 50 + r() * 110, h = 50 + r() * 120; city += `<rect x="${x.toFixed(0)}" y="${(H - 150 - h).toFixed(0)}" width="${w.toFixed(0)}" height="${(h + 150).toFixed(0)}" fill="${fg}"/>`; if (r() > 0.6) city += `<rect x="${(x + w * 0.3).toFixed(0)}" y="${(H - 150 - h + 22).toFixed(0)}" width="10" height="16" rx="5" fill="${sun}" opacity=".7"/>`; x += w + 4 + r() * 18; }
  const mx = W * (0.55 + r() * 0.25);
  const minaret = `<rect x="${mx}" y="${H - 470}" width="58" height="330" fill="${fg}"/><rect x="${mx + 12}" y="${H - 520}" width="34" height="56" fill="${fg}"/><rect x="${mx + 24}" y="${H - 552}" width="10" height="34" fill="${fg}"/><circle cx="${mx + 29}" cy="${H - 556}" r="7" fill="${fg}"/>`;
  const palm = (px, py, sc) => `<g transform="translate(${px} ${py}) scale(${sc})"><path d="M0 0 C 8 -60, 4 -130, 18 -190" stroke="${fg}" stroke-width="12" fill="none"/>${[-70, -35, 0, 35, 70, 110, -110].map(a => `<ellipse cx="18" cy="-190" rx="64" ry="12" transform="rotate(${a} 18 -190) translate(46 0)" fill="${fg}"/>`).join('')}</g>`;
  const sea = coastal ? `<rect x="0" y="${H - 250}" width="${W}" height="120" fill="${m1}"/><rect x="0" y="${H - 250}" width="${W}" height="6" fill="${sun}" opacity=".5"/>` : '';

      return `<g class="pin${p.l.diamond ? ' dia' : ''}" tabindex="0" role="button" aria-label="${esc(p.l.title)}, ${mad(pubPrice(p.l, u))}" data-act="go" data-to="listing" data-id="${p.l.id}" data-pins="${p.l.id}" transform="translate(${X(p.g.lng).toFixed(1)} ${(Y(p.g.lat) - dy).toFixed(1)})"><rect x="${-w / 2}" y="-30" width="${w}" height="26" rx="13"/><text x="0" y="-12.5" text-anchor="middle">${esc(label)}</text></g>`; }).join('');
  }
  const step = span < 0.6 ? 0.02 : 0.5; let grid = '';
  for (let v = Math.ceil(minLng / step) * step; v < maxLng; v += step) grid += `<line x1="${X(v).toFixed(1)}" y1="0" x2="${X(v).toFixed(1)}" y2="${H.toFixed(0)}"/>`;
  for (let v = Math.ceil(minLat / step) * step; v < maxLat; v += step) grid += `<line x1="0" y1="${Y(v).toFixed(1)}" x2="${W}" y2="${Y(v).toFixed(1)}"/>`;
  return `<svg viewBox="0 0 ${W} ${H.toFixed(0)}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Carte des logements"><rect width="${W}" height="${H.toFixed(0)}" fill="var(--sea)"/>
    <polygon points="${poly(COAST)}" fill="var(--land)" stroke="var(--land-line)" stroke-width="1.5"/><polygon points="${poly(SPAIN)}" fill="var(--land)" stroke="var(--land-line)" stroke-width="1.5"/>
    <g stroke="var(--land-line)" stroke-width="1" opacity=".55">${grid}</g>${cityDots}${marks}</svg>`;
}

/* ---------- Photos : stockées dans le navigateur pour la démo (IndexedDB) ----------
   En production : stockage objet (S3 ou équivalent) avec redimensionnement côté serveur. */
const PhotoDB = {
  db: null, cache: {},
  init() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('douira-photos', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('p');
        r.onerror = () => res(0);
        r.onsuccess = () => {
          this.db = r.result;
          try {
            const req = this.db.transaction('p').objectStore('p').openCursor(); let n = 0;
            req.onsuccess = () => { const c = req.result; if (c) { this.cache[c.key] = c.value; n++; c.continue(); } else res(n); };
            req.onerror = () => res(0);
          } catch (e) { res(0); }
        };
      } catch (e) { res(0); }
    });
  },
  put(id, data) { this.cache[id] = data; try { this.db && this.db.transaction('p', 'readwrite').objectStore('p').put(data, id); } catch (e) { /* mémoire seulement */ } },
  del(id) { delete this.cache[id]; try { this.db && this.db.transaction('p', 'readwrite').objectStore('p').delete(id); } catch (e) { /* ignoré */ } }
};
const realPhotos = l => (l.photoUrls && l.photoUrls.length) ? l.photoUrls : (l.photos || []).filter(id => PhotoDB.cache[id]);
function lphoto(l, i = 0) { if (l.photoUrls && l.photoUrls.length) return l.photoUrls[i % l.photoUrls.length]; const ph = realPhotos(l); return ph.length ? PhotoDB.cache[ph[i % ph.length]] : art(l.art + i, i % 3); }
async function fileToJpeg(file, max = 1600) {
  const url = URL.createObjectURL(file); const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
  c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg', 0.82);
}
function photoPanel(l) {
  const ph = realPhotos(l);
  return `<section class="panel stack" id="photo-panel"><div class="panel-h" style="margin:0"><h3>Photos du bien</h3><label class="btn btn-p btn-s" for="ph-add">Ajouter des photos<input type="file" id="ph-add" accept="image/*" multiple data-chg="photoAdd" data-id="${l.id}" hidden></label></div>
    ${ph.length ? `<div class="phgrid">${ph.map((id, i) => `<figure><img src="${PhotoDB.cache[id]}" alt="Photo ${i + 1}">${i === 0 ? '<span class="pill ok">Couverture</span>' : ''}<div class="row" style="gap:4px">${i ? `<button type="button" class="btn btn-g btn-s" data-act="photoCover" data-l="${l.id}" data-id="${id}">Mettre en couverture</button>` : ''}<button type="button" class="btn btn-d btn-s" data-act="photoDel" data-l="${l.id}" data-id="${id}">Retirer</button></div></figure>`).join('')}</div>`
      : '<p class="small muted">Aucune photo importée : le site affiche une illustration. Importez les vraies photos du bien (JPEG ou PNG, idéalement 5 ou plus, au format paysage).</p>'}
    <p class="small muted">Démo : les photos sont redimensionnées puis gardées dans ce navigateur. En production, elles sont envoyées sur le serveur et visibles par tous.</p></section>`;
}
C.photoAdd = async el => {
  if (!guard('listings.manage')) return; const l = listing(el.dataset.id); if (!l) return;

/* ---------- Remises ---------- */
function discountOf(l) { const d = l.discount; if (!d || !d.pct) return null; if (d.to && d.to < isoD(today())) return null; return d; }
function activeDiscount(l, start) { const d = l.discount; if (!d || !d.pct) return 0; if (d.from && start < d.from) return 0; if (d.to && start > d.to) return 0; return Number(d.pct); }
function priceHtml(l) {
  const u = tplOf(l).units[0], p = pubPrice(l, u), d = discountOf(l);
  return d ? `<s class="muted num" style="font-weight:400">${mad(p)}</s> <b class="num">${mad(Math.round(p * (100 - d.pct) / 100))}</b>` : `<b class="num">${mad(p)}</b>`;
}
const discBadge = d => `<span class="disc">−${d.pct} %</span>`;

function stepsBar(n) {
  const steps = ['Coordonnées et options', 'Vérification de la facture', 'Paiement sécurisé'];
  return `<div class="gutter"><ol class="steps3 wrap" aria-label="Étapes de la réservation">${steps.map((s, i) => `<li class="${i + 1 < n ? 'done' : i + 1 === n ? 'cur' : ''}"${i + 1 === n ? ' aria-current="step"' : ''}><span class="n">${i + 1}</span>${s}</li>`).join('')}</ol></div>`;
}
/* Échéancier de remboursement, calculé avec les mêmes règles que l'annulation réelle */
function refundSchedule(b) {
  const l = listing(b.listingId), q = b.q, ci = checkinDT(b), ex = q.extrasTotal || 0;
  const at = h => new Date(ci.getTime() - h * 36e5);
  const rows = [];
  const line = (until, pct) => rows.push({ until, pct, amount: Math.round(q.base * pct / 100) + q.tax + ex });
  if (l.policy === 'flexible') { line(at(24), 100); line(ci, 0); }
  else if (l.policy === 'moderee') { line(at(120), 100); line(ci, 50); }
  else { line(at(168), 50); line(ci, 0); }
  return rows.filter(r => r.until > new Date() || r === rows[rows.length - 1]);
}

        <div class="row"><button class="btn btn-g btn-s" data-act="dataRequest" data-kind="copie">Demander une copie de mes données</button><button class="btn btn-g btn-s" data-act="dataRequest" data-kind="suppression">Demander la suppression de mon compte</button>${btnGo('Politique de confidentialité', 'legal', { doc: 'privacy' }, 'btn-link small')}</div></section>
    </div></div>`;
};
F.profile = data => {
  const u = me(); if (!u) return;
  u.name = (data.name || '').trim() || u.name; u.phone = (data.phone || '').trim();
  ['lives', 'langs', 'bio'].forEach(k => { if (data[k] !== undefined) u[k] = String(data[k]).trim(); });
  toast('Profil enregistré.'); go('space', { tab: 'c_profile' });
};
C.avatarAdd = async el => {
  const u = me(), f = el.files[0]; if (!u || !f) return;
  try { const data = await fileToJpeg(f, 400); const id = uid('ph'); if (u.avatar) PhotoDB.del(u.avatar); PhotoDB.put(id, data); u.avatar = id; save(); toast('Photo de profil mise à jour.'); render(); }
  catch (e) { toast('Image illisible. Choisissez un fichier JPEG ou PNG.', true); }
};
A.avatarDel = () => { const u = me(); if (!u || !u.avatar) return; PhotoDB.del(u.avatar); u.avatar = ''; toast('Photo retirée.'); render(); };
A.securityInfo = () => openModal(`<h2>Connexion et sécurité</h2><p>En production : connexion par e-mail et mot de passe, lien de réinitialisation par e-mail, double authentification facultative pour les voyageurs (obligatoire pour l'équipe) et liste des appareils connectés.</p><p class="small muted">Dans cette démonstration, la connexion se fait avec le sélecteur de profil.</p><div><button class="btn btn-g" data-act="closeModal">Fermer</button></div>`);


/* =====================================================================
   Mise en ligne : titres de page, menu mobile, et mode « vitrine »
   Le mode vitrine est activé par config.js (window.DOUIRA_CONFIG.mode = 'vitrine').
   Il ne contient ni comptes, ni paiement, ni données de démonstration :
   les biens, contacts et textes légaux viennent uniquement de config.js.
   ===================================================================== */

/* ---------- Titre de l'onglet selon la page ---------- */
function pageTitle() {
  const n = S.settings.siteName, p = R.p || {};
  const t = {
    search: () => 'Logements' + (p.area ? ' · ' + p.area : ''), listing: () => (listing(p.id) || {}).title, propose: () => 'Proposer mon bien',
    contact: () => 'Contact', legal: () => LEGAL_TITLES[p.doc] || LEGAL_TITLES.mentions, space: () => 'Mon espace', invoice: () => 'Facture',
    checkout: () => 'Réservation', review: () => 'Vérification de la facture', pay: () => 'Paiement', dossier: () => 'Dossier technique'
  }[R.name];
  const x = t && t();
  return x ? `${x} · ${n}` : `${n} · Appartements et villas à ${openCities().join(', ')}`;
}
const _renderBase = render;
render = function () {
  _renderBase();
  try { document.title = pageTitle(); } catch (e) { document.title = S.settings.siteName; }
  document.querySelectorAll('.sfold').forEach(d => { if (window.innerWidth > 760) d.open = true; });
};

/* ---------- Menu mobile : fermeture au clic extérieur, à Échap, au redimensionnement ---------- */
document.addEventListener('click', e => { const t = $('#topbar'); if (t && t.classList.contains('open') && !t.contains(e.target)) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
let _lastWide = window.innerWidth > 760;
window.addEventListener('resize', () => {
  const wide = window.innerWidth > 760;
  if (wide !== _lastWide) { _lastWide = wide; closeMenu(); document.querySelectorAll('.sfold').forEach(d => { d.open = wide || d.open; }); }
});

/* ---------- Mode vitrine ---------- */
const VCFG = IS_VITRINE ? (CFG || {}) : null;
const waNumber = () => String(S.settings.whatsapp || '').replace(/\D/g, '');
const waLink = text => waNumber() ? `https://wa.me/${waNumber()}?text=${encodeURIComponent(text)}` : '';

function vitrineState() {
  seed();
  const c = VCFG, st = S.settings;
  ['siteName', 'whatsapp', 'markupPct'].forEach(k => { if (c[k] !== undefined && c[k] !== '') st[k] = c[k]; });
  st.contactEmail = c.email || '';
  st.adminEmail = c.email || '';
  st.serviceFeePct = 0; st.showPctToClients = false; st.touristTax = 0;
  if (Array.isArray(c.villes) && c.villes.length) st.cities = c.villes;
  const co = c.societe || {};
  st.company = co.raisonSociale || '[Raison sociale à renseigner dans config.js]';
  st.ice = co.ice || '[à renseigner]'; st.rc = co.rc || '[à renseigner]';
  st.companyAddress = co.adresse || '[Adresse à renseigner]'; st.cndp = co.cndp ? 'Récépissé CNDP : ' + co.cndp : '';
  const city = st.cities[0] || 'Marrakech';
  S.content.heroTitle = (c.textes && c.textes.titre) || `Appartements et villas sélectionnés à ${city}.`;
  S.content.heroText = (c.textes && c.textes.introduction) || "Choisissez votre logement et vos dates, envoyez votre demande en un clic : notre équipe vous répond sur WhatsApp, confirme la disponibilité et vous indique les modalités de paiement.";
  S.content.ownerPitch = (c.textes && c.textes.proprietaires) || "Confiez-nous votre appartement ou votre villa : annonce, accueil des voyageurs et suivi des séjours.";
  S.content.faq = (c.textes && Array.isArray(c.textes.faq) && c.textes.faq.length) ? c.textes.faq : [
    { q: 'Comment réserver ?', a: "Choisissez vos dates sur la fiche du logement et envoyez votre demande. Notre équipe vous répond sur WhatsApp pour confirmer la disponibilité, le prix et les modalités de paiement." },
    { q: 'Le prix affiché est-il définitif ?', a: "Le prix affiché par nuit est celui de nos logements. Le montant exact de votre séjour vous est confirmé avec la disponibilité." },
    { q: "Quand est-ce que je reçois l'adresse ?", a: "L'adresse exacte et les informations d'accès vous sont communiquées après la confirmation de votre réservation." },
    { q: 'Je suis propriétaire, comment proposer mon bien ?', a: "Utilisez la page « Proposer mon bien » ou écrivez-nous sur WhatsApp. Un membre de l'équipe vous recontacte pour visiter le bien." }
  ];
  const L = c.legal || {};
  S.content.legal = {
    mentions: L.mentions || '', cgu: L.cgu || '', privacy: L.confidentialite || '', cancellation: L.annulation || ''
  };
  S.listings = (Array.isArray(c.biens) ? c.biens : []).map((b, i) => {
    const villa = /villa/i.test(b.type || '');
    const disc = b.remise && Number(b.remise.pourcentage) > 0 ? { pct: Number(b.remise.pourcentage), label: b.remise.libelle || '', from: b.remise.du || '', to: b.remise.au || '' } : null;
    return {
      id: 'b' + (b.id || i + 1), categoryId: villa ? 'cat_villas' : 'cat_apartments', ownerId: '', status: 'published',
      title: b.titre || 'Logement', city: b.ville || city, area: b.quartier || '', art: i,
      prices: { nuit: Number(b.prixNuit || 0) }, capacity: Number(b.voyageurs || 2),
      attrs: { bedrooms: Number(b.chambres || 0), bathrooms: Number(b.sallesDeBain || 0), surface: Number(b.surface || 0) || undefined },
      amenities: Array.isArray(b.equipements) ? b.equipements : [], description: b.description || '',
      checkIn: b.arrivee || '15:00', checkOut: b.depart || '11:00', rules: b.reglement || '', policy: ['flexible', 'moderee', 'stricte'].includes(b.annulation) ? b.annulation : 'moderee',
      registrationNo: b.numeroAutorisation || '', photoUrls: Array.isArray(b.photos) ? b.photos : [],
      geo: b.positionApprox && b.positionApprox.lat ? { lat: Number(b.positionApprox.lat), lng: Number(b.positionApprox.lng) } : null,
      diamond: b.diamond ? { at: nowIso(), by: 'config' } : null, discount: disc, collaborators: [], cleanerId: '', address: '', accessCode: '', createdAt: nowIso()
    };
  }).filter(l => l.prices.nuit > 0);
  S.users = []; S.bookings = []; S.emails = []; S.tickets = []; S.requests = []; S.audit = []; S.reviews = []; S.favLists = []; S.cleaners = [];
  S.extras = (Array.isArray(c.vehicules) ? c.vehicules : []).map((x, i) => ({ id: 'v' + (i + 1), type: /moto|scooter/i.test(x.type || '') ? 'moto' : 'voiture', name: x.nom || 'Véhicule', specs: x.description || '', pricePerDay: Number(x.prixJour || 0), deposit: Number(x.caution || 0), active: true, blocks: [], photoUrl: x.photo || '' })).filter(x => x.pricePerDay > 0);
  S.session.userId = null;
}
function configMissing() {
  if (!VCFG) return [];
  const m = [];
  if (!waNumber()) m.push('Numéro WhatsApp (whatsapp)');
  if (!VCFG.email) m.push('E-mail de contact (email)');
  if (!VCFG.siteUrl) m.push('Adresse du site (siteUrl)');
  const co = VCFG.societe || {}; if (!co.raisonSociale || !co.ice) m.push('Informations de la société (societe)');
  const L = VCFG.legal || {}; ['mentions', 'cgu', 'confidentialite', 'annulation'].forEach(k => { if (!L[k]) m.push('Texte légal : ' + k); });
  if (!S.listings.length) m.push('Aucun bien (biens)');
  if (S.listings.some(l => !(l.photoUrls || []).length)) m.push('Photos manquantes pour certains biens');
  return m;
}

if (IS_VITRINE) {
  document.documentElement.classList.add('vitrine');
  load = function () { vitrineState(); };
  save = function () { /* rien à enregistrer : le contenu vient de config.js */ };
  renderDemobar = function () { const d = $('#demobar'); if (d) { d.innerHTML = ''; d.hidden = true; } };
  heartBtn = () => ''; favInlineBtn = () => ''; favHeaderBtn = () => '';
  const _ratingLine = ratingLine; ratingLine = l => l.diamond ? _ratingLine(l) : '';
  ['space', 'checkout', 'review', 'pay', 'invoice', 'dossier'].forEach(v => { VIEWS[v] = () => { setTimeout(() => go('home'), 0); return ''; }; });
  A.login = () => go('propose');
  const legalBase = VIEWS.legal;
  VIEWS.legal = p => {
    const doc = LEGAL_TITLES[p.doc] ? p.doc : 'mentions';
    if (!S.content.legal[doc]) return legalBase(Object.assign({}, p, { doc })).replace(/<p>\s*<\/p>/, '<p>Ce texte est en cours de rédaction. Pour toute question, contactez-nous.</p>');
    return `<div class="gutter"><div class="wrap" style="padding-block:28px 10px"><div class="prose"><span class="eyebrow">Informations légales</span><h1 style="font-size:clamp(1.7rem,3vw,2.3rem)">${LEGAL_TITLES[doc]}</h1>${S.content.legal[doc].split(/\n{2,}/).map(par => `<p>${esc(par)}</p>`).join('')}</div></div></div>`;
  };
}

function vitrineChecks() {
  if (!IS_VITRINE) return;
  if (VCFG.siteUrl) { try { const u = String(VCFG.siteUrl).replace(/\/$/, '') + '/'; const l = document.createElement('link'); l.rel = 'canonical'; l.href = u; document.head.appendChild(l); } catch (e) { /* ignoré */ } }
  if (!CFG) console.warn('[Douira] config.js introuvable : le site s\'affiche vide. Déposez config.js à côté de index.html.');
  if (configMissing().length) console.warn('[Douira] À compléter dans config.js :', configMissing());
}
// Démo mise en ligne pour un essai (Render, etc.) : les moteurs de recherche ne l'indexent pas.
// La vitrine, elle, reste indexable.
function demoNoIndex() {
  if (IS_VITRINE || typeof window === 'undefined' || !window.DOUIRA_STANDALONE) return;
  try { const m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex, nofollow'; document.head.appendChild(m); } catch (e) { /* ignoré */ }
}

/* ---------- Envoi d'une demande (vitrine) : WhatsApp ou e-mail ---------- */
function sendPanel(title, text) {
  const wa = waLink(text), mail = S.settings.contactEmail;
  return `<h2>${esc(title)}</h2>
    <p>Votre message est prêt. Envoyez-le sur WhatsApp : notre équipe vous répond directement.</p>
    ${wa ? `<a class="btn btn-p" href="${esc(wa)}" target="_blank" rel="noopener">Envoyer sur WhatsApp</a>` : '<div class="note bad small">Le numéro WhatsApp n\'est pas encore configuré.</div>'}
    ${mail ? `<p class="small">Vous préférez l'e-mail ? Écrivez à <b class="mono">${esc(mail)}</b> ${copyBtn(mail, 'Copier l\'adresse')}</p>` : ''}
    <details class="small"><summary>Voir le message</summary><pre style="white-space:pre-wrap;font:inherit;margin:8px 0 0">${esc(text)}</pre>${copyBtn(text, 'Copier le message')}</details>
    <div><button class="btn btn-g" data-act="closeModal">Fermer</button></div>`;
}
if (IS_VITRINE) {
  A.book = d => {
    const l = listing(d.id), v = readBk();
    const err = validateDates(l, v.start, v.end, v.guests); if (err) return toast(err, true);
    const q = quote(l, v.start, v.end, v.guests, v.unit);
    const xs = S.extras.filter(x => x.active);
    openModal(`<h2>Demande de réservation</h2>
      <div class="panel stack-s"><b>${esc(l.title)}</b><span class="small muted">${esc(l.area)}, ${esc(l.city)} · du ${fmtD(v.start)} au ${fmtD(v.end)} · ${plural(v.guests, 'voyageur')}</span>${breakdownHtml(q)}<span class="small muted">Montant indicatif, confirmé par notre équipe avec la disponibilité. Rien n'est payé maintenant.</span></div>
      <form class="stack" data-form="vBook" data-id="${l.id}" data-start="${v.start}" data-end="${v.end}" data-guests="${v.guests}">
        <div class="fgrid">${field('Nom complet', '<input name="name" id="vb-name" required autocomplete="name">')}${field('Téléphone (WhatsApp)', '<input name="phone" id="vb-phone" required type="tel" autocomplete="tel" placeholder="+212 6 …">')}</div>
        ${xs.length ? `<fieldset class="stack-s"><legend>Ajouter un véhicule (selon disponibilité)</legend>${xs.map(x => `<label class="check"><input type="checkbox" name="extras" value="${x.id}"> <span>${esc(x.name)} · ${mad(x.pricePerDay)} / jour${x.deposit ? ', caution ' + mad(x.deposit) : ''}</span></label>`).join('')}</fieldset>` : ''}
        ${field('Message (facultatif)', '<textarea name="message" id="vb-msg" placeholder="Heure d\'arrivée prévue, questions…"></textarea>')}
        <label class="check"><input type="checkbox" name="consent" id="vb-consent" required> <span>J'accepte que ces informations soient utilisées pour traiter ma demande (<button type="button" class="btn-link" data-act="go" data-to="legal" data-doc="privacy">confidentialité</button>).</span></label>
        <div class="row"><button class="btn btn-p" type="submit">Préparer ma demande</button><button type="button" class="btn btn-g" data-act="closeModal">Annuler</button></div></form>`);
  };
  F.vBook = (data, form) => {
    const l = listing(form.dataset.id), fd = new FormData(form), ex = fd.getAll('extras').map(id => extra(id)).filter(Boolean);
    const q = quote(l, form.dataset.start, form.dataset.end, Number(form.dataset.guests));
    const text = [`Bonjour, je souhaite réserver « ${l.title} » (${l.area}, ${l.city}).`, `Dates : du ${fmtD(form.dataset.start)} au ${fmtD(form.dataset.end)}, ${plural(Number(form.dataset.guests), 'voyageur')}.`,
      `Montant indiqué sur le site : ${mad(q.total)} pour ${plural(q.qty, 'nuit')}.`, ex.length ? `Véhicule souhaité : ${ex.map(x => x.name).join(', ')}.` : '', data.message ? `Message : ${data.message.trim()}` : '',
      `Nom : ${data.name.trim()} · Téléphone : ${data.phone.trim()}`].filter(Boolean).join('\n');
    openModal(sendPanel('Votre demande est prête', text));
  };
  VIEWS.contact = p => {
    const st = S.settings;
    return `<div class="gutter"><div class="wrap" style="padding-block:28px 10px"><div class="split">
      <form class="stack-l" data-form="vContact">
        <div class="stack-s"><h1 style="font-size:clamp(1.7rem,3vw,2.3rem)">Contact et réclamations</h1><p class="muted" style="max-width:62ch">Une question, une réclamation ou un problème pendant votre séjour : écrivez-nous, notre équipe vous répond sur WhatsApp ou par e-mail.</p></div>
        <div class="panel fgrid">
          ${field('Type de demande', `<select id="ct-type" name="type">${opt('Question', 'Question', p.type)}${opt('Réclamation', 'Réclamation', p.type)}${opt('Problème pendant un séjour', 'Signaler un problème', p.type)}</select>`)}
          ${field('Nom', '<input id="ct-name" name="name" required autocomplete="name">')}${field('Téléphone ou e-mail', '<input id="ct-reach" name="reach" required>')}
          ${field('Objet', '<input id="ct-subject" name="subject" required>', '', 'full')}${field('Message', '<textarea id="ct-msg" name="message" required></textarea>', '', 'full')}
          <label class="check full"><input type="checkbox" id="ct-consent" name="consent" required> <span>J'accepte que mes données soient utilisées pour traiter ma demande (loi 09-08).</span></label>
          <div class="full"><button class="btn btn-p" type="submit">Préparer mon message</button></div></div></form>
      <aside class="stack"><div class="panel stack-s"><h3>Nous joindre directement</h3>
        ${st.whatsapp ? `<div class="row between"><span>WhatsApp <b class="mono">${esc(st.whatsapp)}</b></span>${copyBtn(st.whatsapp)}</div>` : ''}
        ${st.contactEmail ? `<div class="row between"><span>E-mail <b class="mono">${esc(st.contactEmail)}</b></span>${copyBtn(st.contactEmail)}</div>` : ''}
        ${!st.whatsapp && !st.contactEmail ? '<p class="small muted">Coordonnées en cours de mise à jour.</p>' : ''}</div></aside>
    </div></div></div>`;
  };
  F.vContact = data => openModal(sendPanel('Votre message est prêt', `[${data.type}] ${data.subject.trim()}\n${data.message.trim()}\n\n${data.name.trim()} · ${data.reach.trim()}`));
  F.propose = data => openModal(sendPanel('Votre demande est prête', [`Bonjour, je souhaite proposer mon bien à la location.`, `Bien : ${data.kind || '—'} · ${data.city}${data.area ? ', ' + data.area : ''}`, data.message ? `Précisions : ${data.message.trim()}` : '', `${data.name.trim()} · ${data.phone.trim()}${data.email ? ' · ' + data.email.trim() : ''}`].filter(Boolean).join('\n')));
}

/* ---------- Libellés accessibles des filtres ---------- */
const FILTER_LABELS = { 'ls-s': 'Statut', 'ls-c': 'Catégorie', 'rq-f': 'Statut', 'bk-f': 'Période', 'tk-s': 'Statut', 'tk-t': 'Type', 'tk-w': 'Assignation', 'rv-k': 'Type d\'avis', 'us-r': 'Rôle' };
const _afterRender = afterRender;
afterRender = function () {
  _afterRender();
  Object.entries(FILTER_LABELS).forEach(([id, lab]) => { const el = document.getElementById(id); if (el && !el.getAttribute('aria-label')) el.setAttribute('aria-label', lab); });
  document.querySelectorAll('select[id^="cl-"]').forEach(el => el.setAttribute('aria-label', 'Prestataire de ménage'));
  document.querySelectorAll('input[id^="xs-"]').forEach(el => el.setAttribute('aria-label', 'Début de la location'));
  document.querySelectorAll('input[id^="xe-"][type="date"]').forEach(el => el.setAttribute('aria-label', 'Fin de la location'));
};

load();
vitrineChecks();
demoNoIndex();
try { const [n, p] = parseHash(location.hash); R.name = n; R.p = p; } catch (e) { /* adresse illisible : accueil */ }
render();
setHistory(true);
PhotoDB.init().then(n => { if (n) render(); });

</script>
