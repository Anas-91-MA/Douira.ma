<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

<script src="config.js"></script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout : barre de démonstration + en-tête collant ; pages publiques en colonne de 1200px ;
   espaces de gestion en grille « barre latérale + contenu » qui passe en onglets défilants sur mobile. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E7EDE9; --line:#D2DCD7; --ink:#14211E; --muted:#5A6A66;
  --accent:#0E6B5C; --accent-ink:#FFFFFF; --accent-soft:#D5EAE3;
  --gold:#A8741F; --gold-soft:#F3E6CA;
  --ok:#2C7A47; --ok-soft:#DCEFE1; --warn:#9A6200; --warn-soft:#F7EACD; --bad:#B03838; --bad-soft:#F5DDDA; --info:#2B5D97; --info-soft:#DBE6F3;
  --diamond:#1F6A90; --diamond-2:#2F86AE; --diamond-ink:#FFFFFF; --diamond-soft:#DCEEF6;
  --shadow:0 1px 2px rgba(20,33,30,.06),0 6px 24px rgba(20,33,30,.07);
  --f-display:"Gloock","Iowan Old Style",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
:root[data-brand="majorelle"]{--accent:#2944A6;--accent-soft:#DCE2F6;--accent-ink:#FFFFFF}
:root[data-brand="ocre"]{--accent:#9C4A1A;--accent-soft:#F4E0D2;--accent-ink:#FFFFFF}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1615; --surface:#15201E; --surface-2:#1C2927; --line:#2B3A37; --ink:#E4EDEA; --muted:#98A9A4;
    --accent:#45B79F; --accent-ink:#04201A; --accent-soft:#173A33;
    --gold:#DDB062; --gold-soft:#3A2E16;
    --ok:#5DC07D; --ok-soft:#163022; --warn:#E2A841; --warn-soft:#372A11; --bad:#EC7F76; --bad-soft:#3B1D1B; --info:#80AAE2; --info-soft:#18273B;
    --diamond:#6BC0E4; --diamond-2:#A9DEF2; --diamond-ink:#062433; --diamond-soft:#163341;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  :root[data-brand="majorelle"]:not([data-theme="light"]){--accent:#8FA6F2;--accent-soft:#1E2A4F;--accent-ink:#0B1433}
  :root[data-brand="ocre"]:not([data-theme="light"]){--accent:#E59A66;--accent-soft:#3C2418;--accent-ink:#2A1206}
}
:root[data-theme="dark"]{
  --bg:#0E1615; --surface:#15201E; --surface-2:#1C2927; --line:#2B3A37; --ink:#E4EDEA; --muted:#98A9A4;
  --accent:#45B79F; --accent-ink:#04201A; --accent-soft:#173A33;
  --gold:#DDB062; --gold-soft:#3A2E16;
  --ok:#5DC07D; --ok-soft:#163022; --warn:#E2A841; --warn-soft:#372A11; --bad:#EC7F76; --bad-soft:#3B1D1B; --info:#80AAE2; --info-soft:#18273B;
    --diamond:#6BC0E4; --diamond-2:#A9DEF2; --diamond-ink:#062433; --diamond-soft:#163341;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root[data-theme="dark"][data-brand="majorelle"]{--accent:#8FA6F2;--accent-soft:#1E2A4F;--accent-ink:#0B1433}
:root[data-theme="dark"][data-brand="ocre"]{--accent:#E59A66;--accent-soft:#3C2418;--accent-ink:#2A1206}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,4.2vw,3.1rem);letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.45rem,2.6vw,1.9rem)}
h3{font-size:1.08rem;font-weight:700}
h4{font-size:.95rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em;font-variant-numeric:tabular-nums;white-space:nowrap}
.prose .mono,dd.mono,p.mono{white-space:normal;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;width:100%}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.stack-l{display:flex;flex-direction:column;gap:28px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Barre de démonstration */
.demobar{background:var(--ink);color:var(--bg);font-size:.82rem}
.demobar .wrap{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding-block:7px}
.demobar select{background:transparent;color:inherit;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);border-radius:6px;padding:3px 6px;font:inherit;max-width:100%}
.demobar select option{color:#14211E;background:#fff}
.demobar button{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.demobar .tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);padding:1px 6px;border-radius:4px}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:none;border:0;cursor:pointer;padding:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.55rem;letter-spacing:.01em}
.brand svg{width:30px;height:30px;color:var(--accent)}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main button{background:none;border:0;font:inherit;font-weight:600;color:var(--muted);padding:7px 10px;border-radius:8px;cursor:pointer}
nav.main button:hover,nav.main button[aria-current="true"]{color:var(--ink);background:var(--surface-2)}
.top .spacer{flex:1}

/* Boutons et champs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:.92rem;border-radius:8px;padding:9px 16px;border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn-p{background:var(--accent);color:var(--accent-ink)}
.btn-p:hover{filter:brightness(1.08)}
.btn-g{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-g:hover{border-color:var(--muted)}
.btn-d{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.btn-s{padding:6px 11px;font-size:.84rem}
.btn-link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:600;color:var(--ink);min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:.8rem}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:0;border-color:var(--accent)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:.9rem;font-weight:400}
.check input{margin-top:4px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;margin:0;min-width:0}
legend{font-weight:700;font-size:.9rem;padding:0 6px}

/* Surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.note{border-left:3px solid var(--gold);background:var(--gold-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.88rem}
.note.info{border-color:var(--info);background:var(--info-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.hyp{display:inline-block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:4px;padding:0 5px;vertical-align:2px}
.val{display:inline-block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);border-radius:4px;padding:0 5px;vertical-align:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-size:1.75rem;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .s{font-size:.8rem;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
dl.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 16px;margin:0;font-size:.92rem}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.secret{font-family:var(--f-mono);background:var(--surface-2);border:1px dashed var(--line);padding:2px 8px;border-radius:6px;letter-spacing:.08em}

/* Accueil */
.hero{position:relative;overflow:hidden;background:var(--surface);border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding-block:44px 40px}
.hero p.lead{font-size:1.08rem;color:var(--muted);max-width:52ch;margin-top:14px}
.hero-art{border-radius:180px 180px 14px 14px;overflow:hidden;aspect-ratio:4/5;max-width:100%;max-height:440px;justify-self:end;width:100%;border:1px solid var(--line)}
.hero-art img{width:100%;height:100%;object-fit:cover;display:block}
.search{display:grid;grid-template-columns:minmax(150px,1.4fr) 1fr 1fr minmax(80px,.6fr) auto;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow);margin-top:26px;align-items:end}
.search label.f{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.cat-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--ink)}
.cat-chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.lcard{display:flex;flex-direction:column;gap:10px;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.lcard .ph{border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--surface-2);position:relative}
.lcard .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.lcard:hover .ph img{transform:scale(1.03)}
.lcard .badge{position:absolute;top:10px;left:10px;background:var(--surface);color:var(--ink);font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px}
.lcard h3{font-size:1rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;counter-reset:st}
.step{border-top:2px solid var(--ink);padding-top:12px}
.step .n{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.band{background:var(--surface);border-block:1px solid var(--line)}
.owner-cta{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding-block:34px}
section.sec{padding-block:44px}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}
.faq summary{cursor:pointer;font-weight:600}
.faq details p{margin-top:8px;color:var(--muted);max-width:70ch}

/* Fiche annonce */
.gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:8px;border-radius:14px;overflow:hidden;aspect-ratio:2.2/1;max-width:100%}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery img:first-child{grid-row:1/3}
.ldetail{display:grid;grid-template-columns:1fr 360px;gap:36px;align-items:start}
.bookbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.price{font-family:var(--f-display);font-size:1.6rem}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:.86rem}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.92rem}
.breakdown .tot{font-weight:700;border-top:1px solid var(--line);padding-top:8px}
.amen{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 16px;padding:0;margin:0;list-style:none}
.amen li::before{content:"◆ ";color:var(--gold);font-size:.7em}

/* Espaces */
.shell{display:grid;grid-template-columns:232px 1fr;gap:26px;padding-block:24px 48px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);display:flex;flex-direction:column;gap:2px}
.side .who{padding:4px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side .who b{display:block}
.side button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:0;font:inherit;font-weight:500;color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer}
.side button:hover{background:var(--surface-2);color:var(--ink)}
.side button[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.side .count{font-family:var(--f-mono);font-size:.74rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink)}
.side .grp{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px;font-weight:700}
.mainc{min-width:0;display:flex;flex-direction:column;gap:22px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead h1{font-size:clamp(1.6rem,3vw,2.2rem)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.thumb{width:64px;height:48px;border-radius:6px;object-fit:cover;display:block}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 13px;border-radius:12px;background:var(--surface-2);font-size:.92rem}
.msg.me{align-self:flex-end;background:var(--accent-soft)}
.msg.internal{background:var(--gold-soft);border:1px dashed var(--gold)}
.msg .meta{font-size:.74rem;color:var(--muted);margin-bottom:3px}
.email{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.email .eh{background:var(--surface-2);padding:12px 16px;font-size:.86rem;display:grid;gap:2px}
.email .eb{padding:18px 16px;display:flex;flex-direction:column;gap:10px;font-size:.94rem;max-width:68ch}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:700}
.no{color:var(--muted)}
.diag{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.diag .box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);font-size:.86rem}
.diag .box b{display:block;font-size:.9rem}
.diag .layer{grid-column:1/-1;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem}
.flow span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px}
.flow i{font-style:normal;color:var(--muted)}
.prose{max-width:72ch;display:flex;flex-direction:column;gap:12px}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer}

/* Modale et notifications */
.modal-bg{position:fixed;inset:0;background:rgba(10,18,16,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:10px;font-size:.9rem;box-shadow:var(--shadow);animation:tin .25s ease-out}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
footer.foot{border-top:1px solid var(--line);background:var(--surface);margin-top:40px}
footer.foot .wrap{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:24px;padding-block:30px}
footer.foot button{background:none;border:0;font:inherit;color:var(--muted);padding:2px 0;cursor:pointer;text-align:left}
footer.foot button:hover{color:var(--ink);text-decoration:underline}
.psp{border:2px solid var(--info);border-radius:14px;padding:20px;background:var(--surface);display:flex;flex-direction:column;gap:14px}
.timer{font-family:var(--f-mono);color:var(--warn)}

.stars{position:relative;display:inline-block;color:var(--line);font-size:.95rem;line-height:1;letter-spacing:1px;vertical-align:-1px;white-space:nowrap}
.stars::before{content:"★★★★★"}
.stars i{position:absolute;inset:0 auto 0 0;overflow:hidden;white-space:nowrap;color:var(--gold)}
.stars i::before{content:"★★★★★"}
.stars.sm{font-size:.8rem}
.stars.lg{font-size:1.3rem}
.rate{display:inline-flex;flex-direction:row-reverse;justify-content:flex-end;gap:2px;position:relative}
.rate input{position:absolute;opacity:0;width:1px;height:1px}
.rate label{font-size:2.1rem;line-height:1;color:var(--line);cursor:pointer;padding:0 2px}
.rate input:checked ~ label,.rate label:hover,.rate label:hover ~ label{color:var(--gold)}
.rate input:focus-visible + label{outline:2px solid var(--accent);border-radius:4px}
.dia-badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--diamond-ink);background:linear-gradient(135deg,var(--diamond),var(--diamond-2));padding:3px 10px 3px 7px;border-radius:999px;white-space:nowrap;line-height:1.3}
.dia-badge svg{width:14px;height:14px;flex:none}
.dia-motif{background-color:var(--surface);background-image:linear-gradient(135deg,var(--diamond-soft) 25%,transparent 25%),linear-gradient(225deg,var(--diamond-soft) 25%,transparent 25%),linear-gradient(45deg,var(--diamond-soft) 25%,transparent 25%),linear-gradient(315deg,var(--diamond-soft) 25%,transparent 25%);background-size:18px 18px;background-position:9px 0,9px 0,0 0,0 0}
.lcard.diamond .ph{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--diamond)}
.lcard .ph .dia-badge{position:absolute;bottom:22px;left:10px}
.lwrap{position:relative;min-width:0;display:flex;flex-direction:column}
.heart{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.heart svg,.favbtn svg,.maplinks svg{width:18px;height:18px;flex:none}
.heart[aria-pressed="true"],.favbtn[aria-pressed="true"]{color:var(--bad)}
.heart[aria-pressed="true"] svg path,.favbtn[aria-pressed="true"] svg path{fill:currentColor}
.maplinks{gap:6px}
.favlist .item{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:14px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:640px){.favlist .item{grid-template-columns:80px minmax(0,1fr)}.favlist .item .acts{grid-column:1/-1}}
.lcard .ph .motif{position:absolute;left:0;right:0;bottom:0;height:14px;opacity:.95}
.dia-band{display:flex;align-items:center;gap:14px;border:1px solid var(--diamond);border-radius:12px;padding:12px}
.dia-band > div{background:var(--surface);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.dia-band svg.big{width:44px;height:44px;color:var(--diamond);flex:none;background:var(--surface);border-radius:50%;padding:8px}
.dia-sec{border-block:1px solid var(--line)}
.dia-sec .wrap > .head{background:var(--surface);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.review{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px;max-width:70ch}
.review.hidden{opacity:.55}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:4px 28px}
@media (max-width:960px){
  .hero .wrap{grid-template-columns:1fr}
  .hero-art{display:none}
  .search{grid-template-columns:1fr 1fr}
  .search .btn{grid-column:1/-1}
  .ldetail{grid-template-columns:1fr}
  .bookbox{position:static}
  .shell{grid-template-columns:1fr;gap:16px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .side .who,.side .grp{display:none}
  .side button{white-space:nowrap}
  .split,.two{grid-template-columns:1fr}
  footer.foot .wrap{grid-template-columns:1fr}
  .diag{grid-template-columns:1fr}
}
@media (max-width:760px){
  header.top{position:static}
  header.top .wrap{gap:8px 12px}
  nav.main{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto}
  nav.main button{white-space:nowrap}
}
@media (max-width:560px){
  .search{grid-template-columns:1fr}
  .gallery{grid-template-columns:1fr;grid-template-rows:auto;aspect-ratio:auto}
  .gallery img{aspect-ratio:4/3}
  .gallery img:not(:first-child){display:none}
  .owner-cta{grid-template-columns:1fr}
  dl.kv{grid-template-columns:1fr}
  dl.kv dt{margin-top:6px}
  .msg{max-width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Front-end public v2 : vitrine de location (hero illustré, recherche liste + carte) ===== */
:root{--night:#10201C;--night-ink:#EEF3F1;--night-muted:#A3B6B0;--chip:#FFFFFF;--chip-ink:#13201D;--sea:#CFE3EC;--land:#EFE9DD;--land-line:#D8CDB8;--pin:#13201D;--pin-ink:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--night:#0A1513;--night-ink:#E4EDEA;--night-muted:#8FA39D;--chip:#15201E;--chip-ink:#E4EDEA;--sea:#14262E;--land:#1F2A27;--land-line:#33433F;--pin:#E4EDEA;--pin-ink:#0E1615}}
:root[data-theme="dark"]{--night:#0A1513;--night-ink:#E4EDEA;--night-muted:#8FA39D;--chip:#15201E;--chip-ink:#E4EDEA;--sea:#14262E;--land:#1F2A27;--land-line:#33433F;--pin:#E4EDEA;--pin-ink:#0E1615}

.ico{width:16px;height:16px;flex:none;vertical-align:-3px}
header.top .wrap{padding-block:14px}
nav.main button{font-weight:600}
.top .cta{display:inline-flex}

/* Hero */
.h2v{position:relative;background:var(--night);color:var(--night-ink);overflow:hidden}
.h2v .art{position:absolute;inset:0}
.h2v .art img{width:100%;height:100%;object-fit:cover;display:block}
.h2v .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,16,24,.78) 0%,rgba(10,16,24,.45) 45%,rgba(10,16,24,0) 75%),linear-gradient(0deg,rgba(10,16,24,.55),rgba(10,16,24,0) 40%)}
.h2v .inner{position:relative;max-width:1200px;margin:0 auto;padding-block:84px 120px;display:flex;flex-direction:column;gap:18px}
.h2v h1{font-size:clamp(2.3rem,5.2vw,4.2rem);line-height:1.04;max-width:13ch;color:#FFFFFF;letter-spacing:-.015em}
.h2v p.lead{font-size:1.1rem;max-width:46ch;color:#E6ECEA}
.h2v .facts{display:flex;gap:22px;flex-wrap:wrap;color:#D9E2DF;font-size:.92rem}
.h2v .facts b{color:#FFFFFF;font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin-right:5px}
.dock{position:relative;z-index:2;max-width:1200px;margin:-58px auto 0}
.dock form{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr auto;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(10,20,18,.18);padding:8px;align-items:stretch}
.dock label.f{padding:8px 14px;border-right:1px solid var(--line);gap:2px;font-size:.78rem;color:var(--muted);font-weight:600}
.dock label.f:nth-last-of-type(1){border-right:0}
.dock input,.dock select{border:0;padding:4px 0;background:transparent;font-weight:600;font-size:.98rem}
.dock input:focus,.dock select:focus{outline:none}
.dock label.f:focus-within{background:var(--surface-2);border-radius:12px}
.dock .btn{border-radius:12px;padding-inline:26px;font-size:1rem}

/* Sections */
.sec2{padding-block:56px}
.sec2 .wrap{display:flex;flex-direction:column;gap:22px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(1.6rem,3vw,2.3rem)}
.sec-head p{color:var(--muted);max-width:60ch;margin-top:6px}
.dest{display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:220px 220px;gap:14px}
.dest .tile{position:relative;border-radius:16px;overflow:hidden;border:0;padding:0;cursor:pointer;text-align:left;font:inherit;color:#FFFFFF;background:var(--night)}
.dest .tile:first-child{grid-row:1/3}
.dest.n4 .tile:nth-child(2){grid-column:2/4}
.dest.n3{grid-template-columns:1.25fr 1fr}
.dest.n2{grid-template-columns:1fr 1fr;grid-template-rows:300px}.dest.n2 .tile:first-child{grid-row:auto}
.dest.n1{grid-template-columns:1fr;grid-template-rows:300px}
.dest .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.dest .tile:hover img{transform:scale(1.04)}
.dest .tile span.t{position:absolute;left:0;right:0;bottom:0;padding:18px;background:linear-gradient(0deg,rgba(8,14,20,.75),rgba(8,14,20,0));display:flex;flex-direction:column;gap:2px}
.dest .tile b{font-family:var(--f-display);font-weight:400;font-size:1.7rem;line-height:1.1}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.type{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.type:hover{border-color:var(--accent)}
.type img{width:96px;height:72px;border-radius:10px;object-fit:cover}
.type b{font-size:1.1rem;display:block}

/* Cartes d'annonces */
.lgrid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.lwrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:box-shadow .2s,border-color .2s}
.lwrap:hover,.lwrap.on{box-shadow:0 10px 30px rgba(10,20,18,.12);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.lcard{gap:0}
.lcard .ph{border-radius:0;aspect-ratio:4/3}
.lcard.diamond .ph{box-shadow:none}
.lwrap:has(.lcard.diamond){border:2px solid var(--diamond)}
.lcard .badge{top:12px;left:12px;display:inline-flex;align-items:center;gap:5px}
.lcard .ph .dia-badge{position:absolute;top:12px;left:12px;bottom:auto}
.price-chip{position:absolute;left:12px;bottom:12px;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:5px 12px;font-size:.84rem;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.price-chip b{font-size:.98rem}
.lcard.diamond .price-chip{bottom:22px}
.lbody{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px}
.lbody .loc{color:var(--muted);display:flex;gap:5px;align-items:center}
.lbody h3{font-size:1.04rem;line-height:1.3}
.specs{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.specs span{display:inline-flex;gap:5px;align-items:center}
.specs.lg{gap:10px;font-size:.95rem;color:var(--ink)}
.specs.lg span{background:var(--surface-2);border-radius:10px;padding:10px 14px}
.specs.lg .ico{width:20px;height:20px;color:var(--accent)}
.lfoot{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-size:.88rem}
.dia-text{color:var(--diamond)}
.heart{top:12px;right:12px}

/* Avis */
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
.quote p{font-family:var(--f-display);font-size:1.15rem;line-height:1.45}
.quote .who{font-size:.88rem;color:var(--muted)}

/* Bandeau propriétaires */
.ownerband{position:relative;border-radius:22px;overflow:hidden;color:#FFFFFF;background:var(--night)}
.ownerband img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.ownerband .in{position:relative;padding:48px clamp(20px,5vw,56px);display:flex;flex-direction:column;gap:14px;max-width:640px;background:linear-gradient(90deg,rgba(8,14,20,.7),rgba(8,14,20,0))}
.ownerband h2{color:#FFFFFF;font-size:clamp(1.6rem,3vw,2.4rem)}
.ownerband p{color:#E2E9E6}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.why div{display:flex;flex-direction:column;gap:6px}
.why .ico{width:28px;height:28px;color:var(--accent)}

/* Recherche : liste + carte */
.sbar{background:var(--surface);border-bottom:1px solid var(--line)}
.sbar form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding-block:12px;max-width:1440px;margin:0 auto}
.sbar label.f{flex:1 1 140px;font-size:.76rem;color:var(--muted)}
.sbar input,.sbar select{padding:8px 10px}
.sbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,42%);max-width:1440px;margin:0 auto;align-items:start}
.slist{padding-block:18px 40px;display:flex;flex-direction:column;gap:16px;min-width:0}
.slist .lgrid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.smap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);height:calc(100vh - 90px);min-height:420px;border-left:1px solid var(--line);background:var(--sea)}
.smap svg{width:100%;height:100%;display:block}
.mapbar{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.mapbar > *{pointer-events:auto}
.mapnote{background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.78rem;color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.mapwrap{position:relative;height:100%}
.pin{cursor:pointer}
.pin rect{fill:var(--pin);stroke:var(--surface);stroke-width:1.5}
.pin text{fill:var(--pin-ink);font:700 12.5px var(--f-body)}
.pin.dia rect{fill:var(--diamond)}
.pin.dia text{fill:var(--diamond-ink)}
.pin.on rect,.pin:hover rect{fill:var(--accent)}
.pin.on text,.pin:hover text{fill:var(--accent-ink)}
.pin:focus-visible{outline:none}
.pin:focus-visible rect{stroke:var(--accent);stroke-width:3}
.maptoggle{display:none}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;font:inherit;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Fiche annonce */
.lhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.lhead h1{font-size:clamp(1.8rem,3.6vw,2.7rem)}
.mosaic{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;border-radius:18px;overflow:hidden;aspect-ratio:2.4/1;max-width:100%}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block}
.mosaic img:first-child{grid-row:1/3}
.host{display:flex;gap:14px;align-items:center;border-block:1px solid var(--line);padding-block:16px}
.host .av{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-size:1.4rem;flex:none}
.amen2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 18px;list-style:none;margin:0;padding:0}
.amen2 li{display:flex;gap:8px;align-items:center}
.amen2 .ico{color:var(--accent)}
.minimap{height:260px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
.minimap svg{width:100%;height:100%;display:block}
.bookbox .price{font-size:1.9rem}

/* Pied de page */
footer.foot{background:var(--night);color:var(--night-ink);border-top:0;margin-top:56px}
footer.foot .wrap{grid-template-columns:1.4fr 1fr 1fr 1fr;padding-block:48px 24px}
footer.foot button{color:var(--night-muted)}
footer.foot button:hover{color:var(--night-ink)}
footer.foot .muted,footer.foot .small{color:var(--night-muted)}
footer.foot .brand{color:var(--night-ink)}
footer.foot .eyebrow{color:var(--night-ink);text-transform:none;letter-spacing:0;font-size:.95rem}
footer.foot .legalbar{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.12);padding-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--night-muted)}

@media (max-width:1100px){
  .sbody{grid-template-columns:1fr}
  .smap{display:none;position:relative;top:0;height:70vh;border-left:0}
  .sbody.show-map .smap{display:block}
  .sbody.show-map .slist{display:none}
  .maptoggle{display:inline-flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 8px 24px rgba(0,0,0,.25)}
}
@media (max-width:960px){
  .dock form{grid-template-columns:1fr 1fr}
  .dock label.f{border-right:0;border-bottom:1px solid var(--line)}
  .dock .btn{grid-column:1/-1;margin-top:6px}
  .dest{grid-template-columns:1fr 1fr;grid-template-rows:200px 160px 160px}
  .dest .tile:first-child{grid-row:auto;grid-column:1/-1}
  .dest.n4 .tile:nth-child(2){grid-column:auto}
  .dest.n3,.dest.n2{grid-template-columns:1fr 1fr;grid-template-rows:200px 180px}
  footer.foot .wrap{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){.hide-sm{display:none}}
@media (max-width:560px){
  .h2v .inner{padding-block:48px 96px}
  .dock form{grid-template-columns:1fr}
  .dest{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:170px}
  .mosaic{grid-template-columns:1fr;grid-template-rows:auto;aspect-ratio:auto}
  .mosaic img{aspect-ratio:4/3}
  .mosaic img:not(:first-child){display:none}
  footer.foot .wrap{grid-template-columns:1fr}
}


/* Remises, photos, extras, calendrier */
.disc{position:absolute;right:12px;bottom:12px;background:var(--bad);color:#FFFFFF;font-weight:800;font-size:.86rem;padding:4px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.lhead .disc,.panel .disc{position:static;display:inline-block}
.lcard.diamond .disc{bottom:24px}
.price s{font-size:1.1rem}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.phgrid figure{margin:0;display:flex;flex-direction:column;gap:6px;position:relative}
.phgrid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}
.phgrid .pill{position:absolute;top:8px;left:8px}
.mosaic.m1{grid-template-columns:1fr;grid-template-rows:1fr}
.mosaic.m2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
.mosaic.m2 img:first-child{grid-row:auto}
.mosaic.m3{grid-template-columns:2fr 1fr}
.mosaic.m4{grid-template-columns:2fr 1fr 1fr}
.mosaic.m4 img:last-child{grid-column:2/4}
.xlist{display:flex;flex-direction:column;gap:10px}
.xitem{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.xitem.on{border-color:var(--accent);background:var(--accent-soft)}
.xitem img{width:120px;height:84px;object-fit:cover;border-radius:8px}
.xcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.xcard{display:flex;flex-direction:column;gap:10px;padding:12px}
.xcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.xcard img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px}

function can(k) {
  const r = role();
  if (r === 'admin') return true;
  if (r !== 'collaborator') return false;
  const p = PERMS.find(x => x.k === k);
  if (!p || p.locked) return false;
  if (p.perUser) return !!(me() || {}).diamondRight;
  return !!S.collabPerms[k];
}
function guard(k) { if (can(k)) return true; toast("Action refusée : votre rôle ne dispose pas de cette permission.", true); return false; }
function canRevealCode(l) {
  const u = me(); if (!u) return false;
  if (u.role === 'admin') return true;
  if (u.role === 'owner') return l.ownerId === u.id;
  if (u.role === 'collaborator') return can('accesscode.reveal') && l.collaborators.includes(u.id);
  return false;
}

/* ---------- Tarification, commission, ménage (serveur) ---------- */
function rateFor(l) {
  const o = S.rates.find(r => r.active && r.scope === 'owner' && r.ownerId === l.ownerId);
  if (o) return o;
  const c = S.rates.find(r => r.active && r.scope === 'category' && r.categoryId === l.categoryId);
  if (c) return c;
  return { id: 'default', label: 'Taux par défaut', pct: S.settings.defaultCommission, scope: 'default' };
}
/* Ménage : offre facultative au propriétaire, facturée au tarif fixé par l'administrateur (hors commission) */
function cleaningTariff(l) { const t = (S.settings.cleaningTariff || {})[(category(l.categoryId) || {}).templateId]; return Number(t ?? 125); }
function cleaningFee(l) { const c = cleaner(l.cleanerId); return c && c.active ? cleaningTariff(l) : 0; }
/* Majoration : le prix affiché aux voyageurs = prix du propriétaire + markupPct. Ni le taux ni le prix du propriétaire ne sont montrés aux voyageurs. */
const markupOf = () => Number(S.settings.markupPct ?? 12.5);
function pubPrice(l, unit) { unit = unit || tplOf(l).units[0]; return Math.round(Number(l.prices[unit] || 0) * (1 + markupOf() / 100)); }
function ownerLodging(b) { const ob = b.q.ownerBase ?? b.q.base; if (b.status !== 'cancelled' || !b.cancel) return ob; return Math.round(ob * (b.q.base ? (b.q.base - b.cancel.refund.lodging) / b.q.base : 0)); }
function quote(l, start, end, guests, unit) {
  const tpl = tplOf(l); unit = unit && tpl.units.includes(unit) ? unit : tpl.units[0];
  const days = diffDays(start, end);
  const qty = unit === 'mois' ? Math.max(1, Math.ceil(days / 30)) : days;
  const ownerPrice = Number(l.prices[unit] || 0);
  const price = pubPrice(l, unit);
  const gross = qty * price;
  const discountPct = activeDiscount(l, start);
  const discount = Math.round(gross * discountPct / 100);
  const base = gross - discount;
  const ownerGross = qty * ownerPrice;
  const ownerBase = ownerGross - Math.round(ownerGross * discountPct / 100);
  const cleaning = tpl.cleaning ? cleaningFee(l) : 0;
  const serviceFee = Math.round(base * S.settings.serviceFeePct / 100);
  const tax = tpl.mode === 'stay' ? Math.round(S.settings.touristTax * guests * qty) : 0;
  const rate = rateFor(l);
  const commission = Math.round(ownerBase * rate.pct / 100);
  return { unit, qty, price, gross, discountPct, discount, base, ownerPrice, ownerGross, ownerBase, markupPct: markupOf(), markup: base - ownerBase, extrasTotal: 0, extrasLines: [], cleaning, serviceFee, tax, total: base + serviceFee + tax, ratePct: rate.pct, rateLabel: rate.label, commission, ownerPayout: ownerBase - commission - cleaning, cleanerId: tpl.cleaning ? l.cleanerId : '' };
}
function overlaps(a1, a2, b1, b2) { return parseD(a1) < parseD(b2) && parseD(b1) < parseD(a2); }
function isAvailable(lid, start, end, exceptId) {
  const n = new Date();
  return !S.bookings.some(b => b.listingId === lid && b.id !== exceptId &&
    (b.status === 'confirmed' || (b.status === 'pending_payment' && new Date(b.holdUntil) > n)) && overlaps(start, end, b.start, b.end));
}
function validateDates(l, start, end, guests) {
  if (!start || !end) return 'Choisissez vos dates.';
  if (parseD(start) < today()) return "La date d'arrivée est passée.";
  if (diffDays(start, end) < 1) return 'La date de départ doit suivre la date d\'arrivée.';
  if (guests < 1 || guests > l.capacity) return `Ce logement accueille ${plural(l.capacity, 'personne')} au maximum.`;
  if (!isAvailable(l.id, start, end)) return 'Ces dates ne sont plus disponibles.';
  return '';
}
const checkinDT = b => withTime(b.start, (listing(b.listingId) || {}).checkIn);
const checkoutDT = b => withTime(b.end, (listing(b.listingId) || {}).checkOut);

/* ---------- Réservation et paiement (serveur + prestataire de paiement) ---------- */
function createBooking(lid, clientId, start, end, guests, unit, silent) {
  const l = listing(lid);
  const b = {
    id: uid('b'), ref: 'DR-' + (++S.seq.booking), listingId: lid, clientId, start, end, guests, createdAt: nowIso(),
    status: 'pending_payment', holdUntil: new Date(Date.now() + S.settings.holdMinutes * 60000).toISOString(),
    q: quote(l, start, end, guests, unit), payment: { status: 'en_attente', provider: 'PSP (à choisir)' }, payout: null, access: null, cancel: null
  };
  S.bookings.unshift(b);
  if (!silent) audit('Réservation créée (en attente de paiement)', b.ref);
  return b;
}
function confirmPayment(b, at, silent) {
  at = at || nowIso();
  const l = listing(b.listingId);
  b.status = 'confirmed'; b.confirmedAt = at;
  b.payment = { status: 'capturé', provider: 'PSP (simulation)', ref: 'PSP-' + Math.random().toString(36).slice(2, 8).toUpperCase(), at, amount: b.q.total };
  const releaseAt = new Date(checkinDT(b).getTime() + S.settings.payoutDelayHours * 36e5).toISOString();
  b.payout = { amount: b.q.ownerPayout, status: 'programmé', releaseAt };
  const mode = S.settings.accessCodeMode;
  const codeAt = mode === 'before' ? new Date(Math.max(new Date(at).getTime(), checkinDT(b).getTime() - S.settings.accessCodeHours * 36e5)).toISOString() : at;
  b.access = { mode, releaseAt: codeAt };
  sendConfirmationEmails(b, at);
  if (!silent) audit('Paiement confirmé, e-mails envoyés', b.ref);
  void l;
}
function failPayment(b) { b.status = 'payment_failed'; b.payment = { status: 'refusé', provider: 'PSP (simulation)', at: nowIso() }; audit('Paiement refusé', b.ref); }

function accessState(b) {
  if (!b) return { ok: false, why: '' };
  if (b.status === 'cancelled') return { ok: false, why: "Réservation annulée : les informations d'accès ne sont plus disponibles." };
  if (b.status !== 'confirmed' || !b.payment || b.payment.status !== 'capturé') return { ok: false, why: 'Disponible après confirmation du paiement.' };
  const n = new Date();
  if (n > checkoutDT(b)) return { ok: false, why: "Séjour terminé : le code d'accès n'est plus affiché." };
  if (b.access && n < new Date(b.access.releaseAt)) return { ok: false, why: `Communiqué le ${fmtDT(b.access.releaseAt)}, avant votre arrivée.` };
  return { ok: true, why: '' };
}
function displayStatus(b) {
  const n = new Date();
  if (b.status === 'pending_payment') return new Date(b.holdUntil) < n ? ['Expirée', ''] : ['Paiement en attente', 'warn'];
  if (b.status === 'payment_failed') return ['Paiement refusé', 'bad'];
  if (b.status === 'cancelled') return ['Annulée', 'bad'];
  if (n > checkoutDT(b)) return ['Terminée', ''];
  if (n >= checkinDT(b)) return ['En cours', 'info'];
  return ['Confirmée', 'ok'];
}
function refundCalc(b, byTeam) {
  const q = b.q;
  const ex = q.extrasTotal || 0;
  if (byTeam) return { pct: 100, lodging: q.base, cleaning: 0, tax: q.tax, fee: q.serviceFee, extras: ex, total: q.total, note: "Annulation par l'équipe : remboursement intégral" + (q.serviceFee ? ', frais de service compris.' : '.') };
  const h = (checkinDT(b) - new Date()) / 36e5;
  if (h <= 0) return null;
  const p = listing(b.listingId).policy; let pct = 0;
  if (p === 'flexible') pct = h >= 24 ? 100 : 0;
  else if (p === 'moderee') pct = h >= 120 ? 100 : 50;
  else pct = h >= 168 ? 50 : 0;
  const lodging = Math.round(q.base * pct / 100);
  return { pct, lodging, cleaning: 0, tax: q.tax, fee: 0, extras: ex, total: lodging + q.tax + ex, note: (q.serviceFee ? 'Frais de service non remboursables en cas d\'annulation par le client. ' : '') + (ex ? 'Véhicules remboursés intégralement.' : '') };
}
function cancelBooking(b, byTeam, reason, silent) {
  const r = refundCalc(b, byTeam); if (!r) return null;
  b.status = 'cancelled';
  b.cancel = { at: nowIso(), by: byTeam ? 'team' : 'client', byUser: S.session.userId, reason: reason || '', refund: r };
  b.payment.refunded = r.total;
  b.payment.status = r.total >= b.q.total ? 'remboursé' : (r.total > 0 ? 'remboursé partiellement' : 'capturé');
  const keep = Math.round((b.q.ownerBase ?? b.q.base) * (b.q.base ? (b.q.base - r.lodging) / b.q.base : 0));
  const commission = Math.round(keep * b.q.ratePct / 100);
  b.payout.amount = keep - commission;
  b.payout.status = b.payout.amount > 0 ? 'programmé' : 'annulé';
  const l = listing(b.listingId), owner = user(l.ownerId), client = user(b.clientId);
  const base = { bookingId: b.id };
  addEmail({ ...base, toUserId: client.id, toEmail: client.email, audience: 'client', kind: 'cancel_client', subject: `Annulation de votre réservation ${b.ref}` });
  addEmail({ ...base, toUserId: owner.id, toEmail: owner.email, audience: 'owner', kind: 'cancel_owner', subject: `Réservation annulée ${b.ref} — ${l.title}` });
  teamRecipients(l).forEach(u => addEmail({ ...base, toUserId: u.id, toEmail: u.email, audience: u.role, kind: 'cancel_team', subject: `[Équipe] Annulation ${b.ref}` }));
  if (!silent) audit(`Réservation annulée (${byTeam ? 'équipe' : 'client'}), remboursement ${mad(r.total)}`, b.ref);
  return r;
}
function runPayouts(silent) {
  const n = new Date(); let c = 0;
  S.bookings.forEach(b => {
    if (b.payout && b.payout.status === 'programmé' && new Date(b.payout.releaseAt) <= n) {
      b.payout.status = 'versé'; b.payout.paidAt = nowIso(); b.payout.ref = 'VIR-' + Math.random().toString(36).slice(2, 7).toUpperCase(); c++;
    }
  });
  if (!silent && c) audit(`${plural(c, 'versement')} exécuté(s)`, '—');
  return c;
}

const R = { name: 'home', p: {} };
const routeKey = (n, p) => n + ':' + (p.id || p.tab || p.doc || '');
function routeHash(n, p) {
  if (n === 'home') return '';
  if (n === 'search') return 'logements';
  if (n === 'listing') return 'annonce-' + p.id;
  if (n === 'legal') return 'legal-' + (p.doc || 'mentions');
  if (n === 'propose') return 'proposer';
  if (n === 'space') return 'espace' + (p.tab ? '-' + p.tab + (p.id ? '~' + p.id : '') : '');
  if (n === 'invoice') return 'facture-' + p.id;
  if (['checkout', 'review', 'pay'].includes(n)) return n + '-' + p.id;
  return n;
}
function parseHash(h) {
  h = decodeURIComponent(String(h || '').replace(/^#/, '')); let m;
  if (!h) return ['home', {}];
  if (h === 'logements') return ['search', {}];
  if ((m = h.match(/^annonce-([\w.~-]+)$/))) return ['listing', { id: m[1] }];
  if ((m = h.match(/^legal-(\w+)$/))) return ['legal', { doc: m[1] }];
  if (h === 'proposer') return ['propose', {}];
  if ((m = h.match(/^espace(?:-(\w+)(?:~([\w.-]+))?)?$/))) return ['space', Object.assign(m[1] ? { tab: m[1] } : {}, m[2] ? { id: m[2] } : {})];
  if ((m = h.match(/^facture-([\w.-]+)$/))) return ['invoice', { id: m[1] }];
  if ((m = h.match(/^(checkout|review|pay)-([\w.-]+)$/))) return [m[1], { id: m[2] }];
  if (['contact', 'dossier'].includes(h)) return [h, {}];
  return ['home', {}];
}
function setHistory(replace) {
  try {
    const st = { r: [R.name, R.p] }, url = location.pathname + location.search + (routeHash(R.name, R.p) ? '#' + routeHash(R.name, R.p) : '');
    if (replace) history.replaceState(st, '', url); else history.pushState(st, '', url);
  } catch (e) { /* historique indisponible (cadre isolé) : la navigation reste fonctionnelle */ }
}
function go(name, p = {}) {
  const same = R.name === name && (name === 'search' || routeKey(R.name, R.p) === routeKey(name, p));
  try { if (!same) history.replaceState(Object.assign({}, history.state, { y: window.scrollY }), ''); } catch (e) { /* ignoré */ }
  R.name = name; R.p = p; closeMenu(); render(); setHistory(same); if (!same) window.scrollTo(0, 0);
}
window.addEventListener('popstate', e => {
  const st = e.state && e.state.r ? e.state.r : parseHash(location.hash);
  R.name = st[0]; R.p = st[1] || {}; closeModal(); closeMenu(); render();
  const y = e.state && e.state.y; window.scrollTo(0, y || 0);
});
function closeMenu() { const t = document.getElementById('topbar'); if (t) t.classList.remove('open'); }

function toast(msg, bad) {
  const box = $('#toasts'); while (box.children.length >= 3) box.firstChild.remove();
  const el = document.createElement('div'); el.className = 'toast' + (bad ? ' bad' : ''); el.textContent = msg; el.setAttribute('role', bad ? 'alert' : 'status');
  el.addEventListener('click', () => el.remove());

function readBk() {
  return { start: ($('#bk-start') || {}).value, end: ($('#bk-end') || {}).value, guests: Number(($('#bk-guests') || {}).value || 1), unit: ($('#bk-unit') || {}).value };
}
function breakdownHtml(q) {
  return `<div class="breakdown num">
    <span>${q.qty} ${UNIT_LABEL[q.unit]}${q.qty > 1 && q.unit !== 'mois' ? 's' : ''} × ${mad(q.price)}</span><span>${mad(q.gross ?? q.base)}</span>
    ${q.discount ? `<span style="color:var(--ok)">Remise ${q.discountPct} %</span><span style="color:var(--ok)">− ${mad(q.discount)}</span>` : ''}
    ${q.serviceFee ? `<span>Frais de service${S.settings.showPctToClients ? ` (${S.settings.serviceFeePct} %)` : ''}</span><span>${mad(q.serviceFee)}</span>` : ''}
    ${q.tax ? `<span>Taxe de séjour</span><span>${mad(q.tax)}</span>` : ''}
    ${(q.extrasLines || []).map(x => `<span>${esc(x.name)}</span><span>${mad(x.total)}</span>`).join('')}
    <span class="tot">Total TTC</span><span class="tot">${mad(q.total)}</span></div>`;
}
function updateQuote() {
  const box = $('#qbox'); if (!box) return;
  const l = listing(R.p.id); const v = readBk();
  if (!v.start || !v.end || diffDays(v.start, v.end) < 1) { box.innerHTML = '<p class="small muted">Choisissez des dates valides pour voir le prix total.</p>'; return; }
  const err = validateDates(l, v.start, v.end, v.guests);
  const q = quote(l, v.start, v.end, v.guests, v.unit);
  box.innerHTML = (err ? `<div class="note bad small">${esc(err)}</div>` : '') + breakdownHtml(q);
}

};
const DETAIL_PARENT = { c_booking: 'c_bookings', c_ticket: 'c_tickets', c_email: 'c_inbox', o_prop: 'o_props', o_ticket: 'o_tickets', o_email: 'o_inbox', t_listing: 't_listings', t_booking: 't_bookings', t_ticket: 't_tickets', t_email: 't_inbox', t_logemail: 't_emails' };
const TAB_PERM = { t_listing: 'listings.manage', t_booking: 'bookings.view', t_ticket: 'tickets.manage', t_logemail: 'emails.view' };
const SPACE = {};

function navFor(r) { return r === 'client' ? NAV.client : r === 'owner' ? NAV.owner : NAV.team; }
function navCount(tab) {
  const u = me();
  switch (tab) {
    case 't_requests': return S.requests.filter(r => r.status === 'nouvelle').length;
    case 't_tickets': return S.tickets.filter(t => t.status === 'ouverte').length;
    case 'c_tickets': case 'o_tickets': return S.tickets.filter(t => t.participantId === u.id && t.status !== 'cloturee' && t.messages[t.messages.length - 1].by !== u.id && !t.messages[t.messages.length - 1].internal).length;
    case 'c_reviews': return S.bookings.filter(b => b.clientId === u.id && reviewEligible(b, 'listing')).length;
    case 'o_reviews': return ownerBookings().filter(b => reviewEligible(b, 'client')).length;
    case 't_payouts': return S.bookings.filter(b => b.payout && b.payout.status === 'programmé' && new Date(b.payout.releaseAt) <= new Date()).length;
    default: return 0;
  }
}

VIEWS.space = p => {
  const u = me();
  if (!u) return `<div class="gutter"><div class="wrap" style="padding-block:48px;max-width:560px"><div class="panel stack"><h2>Connexion requise</h2><p class="muted">Dans cette démonstration, choisissez un profil pour ouvrir son espace. En production : e-mail et mot de passe, double authentification obligatoire pour l'équipe.</p><button class="btn btn-p" data-act="login">Choisir un profil</button></div></div></div>`;
  const r = u.role, nav = navFor(r);
  const allowedTabs = nav.filter(n => Array.isArray(n)).map(n => n[0]);
  let tab = p.tab || allowedTabs[0];
  const parent = DETAIL_PARENT[tab];
  const validTab = allowedTabs.includes(tab) || (parent && allowedTabs.includes(parent));
  if (!validTab || !SPACE[tab]) tab = allowedTabs[0];
  const navItem = nav.find(n => Array.isArray(n) && n[0] === (DETAIL_PARENT[tab] || tab));
  const needed = (navItem && navItem[2]) || TAB_PERM[tab];
  const body = needed && !can(needed)
    ? `<div class="panel stack"><h2>Accès refusé</h2><p class="muted">Votre rôle ne permet pas d'ouvrir cette section. Le contrôle est aussi appliqué côté serveur.</p></div>`
    : SPACE[tab](p);
  const cur = DETAIL_PARENT[tab] || tab;
  return `<div class="gutter"><div class="wrap shell">
    <nav class="side" aria-label="Menu de l'espace">
      <div class="who"><span class="eyebrow">${ROLE_LABEL[r]}</span><b>${esc(u.name)}</b><span class="small muted">${esc(u.email)}</span></div>
      ${nav.map((n, i) => {
        if (!Array.isArray(n)) { const next = nav.slice(i + 1); const end = next.findIndex(x => !Array.isArray(x)); const grp = end < 0 ? next : next.slice(0, end); return grp.some(x => !x[2] || can(x[2])) ? `<span class="grp">${n.grp}</span>` : ''; }
        if (n[2] && !can(n[2])) return '';
        const c = navCount(n[0]);
        return `<button data-act="go" data-to="space" data-tab="${n[0]}"${cur === n[0] ? ' aria-current="true"' : ''}>${esc(n[1])}${c ? `<span class="count">${c}</span>` : ''}</button>`;
      }).join('')}
    </nav>
    <label class="side-select" for="sp-nav"><span class="small muted">${ROLE_LABEL[r]} · ${esc(u.name)}</span>
      <select id="sp-nav" data-chg="spaceNav">${(() => { let html = '', open = false; nav.forEach(n => {
        if (!Array.isArray(n)) { if (open) html += '</optgroup>'; html += `<optgroup label="${esc(n.grp)}">`; open = true; return; }
        if (n[2] && !can(n[2])) return; const c = navCount(n[0]); html += opt(n[0], n[1] + (c ? ` (${c})` : ''), cur); }); return html + (open ? '</optgroup>' : ''); })()}</select></label>
    <div class="mainc">${body}</div></div></div>`;
};
const head = (title, sub, actions = '') => `<div class="pagehead"><div class="stack-s"><h1>${esc(title)}</h1>${sub ? `<p class="muted">${sub}</p>` : ''}</div>${actions ? `<div class="row">${actions}</div>` : ''}</div>`;
const back = (tab, label) => `<button class="btn-link small" data-act="go" data-to="space" data-tab="${tab}">← ${esc(label)}</button>`;
const kpi = (label, value, sub) => `<div class="kpi"><span class="eyebrow">${esc(label)}</span><div class="v">${value}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`;
const table = (heads, rows, empty) => rows.length ? `<div class="tablewrap"><table><thead><tr>${heads.map(h => `<th${h.startsWith('>') ? ' class="r"' : ''}>${esc(h.replace(/^>/, ''))}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : `<div class="empty">${empty}</div>`;

function emailHtml(e, viewer) {
  const st = S.settings;
  const b = e.bookingId ? booking(e.bookingId) : null, l = b ? listing(b.listingId) : null;
  const recipient = viewer && e.toUserId === viewer.id;
  const masked = why => `<span class="secret">••••••</span> <span class="small muted">${esc(why)}</span>`;
  const sig = `<p class="small muted">L'équipe ${esc(st.siteName)} · WhatsApp ${esc(st.whatsapp)} · ${esc(st.contactEmail)}</p>`;
  const accessBlock = () => {
    if (!(recipient && viewer.id === b.clientId)) return `<div class="note small"><b>Accès au logement</b><br>Adresse : ${masked('visible uniquement par le client destinataire')}<br>Code d'accès : ${masked('visible uniquement par le client destinataire')}</div>`;
    const acc = accessState(b);
    if (!acc.ok) return `<div class="note small"><b>Accès au logement</b><br>Adresse et code : ${masked(acc.why)}</div>`;
    return `<div class="note ok"><b>Accès au logement</b><br>Adresse : ${esc(l.address)}${l.geo ? `<br>Itinéraire : <a href="${gmapsDir(l.geo)}" target="_blank" rel="noopener">Google Maps</a> · <a href="${wazeNav(l.geo)}" target="_blank" rel="noopener">Waze</a>` : ''}<br>Code d'accès : <span class="secret">${esc(l.accessCode)}</span>${l.wifi ? '<br>Wi-Fi : ' + esc(l.wifi) : ''}<br><span class="small">Code personnel, valable uniquement pendant votre séjour. Ne le transférez pas.</span></div>`;
  };
  const stay = () => `<dl class="kv"><dt>Logement</dt><dd>${esc(l.title)}</dd><dt>Arrivée</dt><dd>${fmtD(b.start)}, à partir de ${esc(l.checkIn)}</dd><dt>Départ</dt><dd>${fmtD(b.end)}, avant ${esc(l.checkOut)}</dd><dt>Voyageurs</dt><dd>${b.guests}</dd></dl>`;
  const client = b ? user(b.clientId) : null, owner = l ? user(l.ownerId) : null;
  let body = '';
  switch (e.kind) {
    case 'client_confirmed':
      body = `<p>Bonjour ${esc(firstName(client.name))},</p>
        <p>Nous confirmons la réception de votre paiement de <b>${mad(b.q.total)}</b> pour ${plural(b.q.qty, 'nuitée')} (réf. de paiement <span class="mono">${esc(b.payment.ref || '—')}</span>). Votre réservation <b>${esc(b.ref)}</b> est confirmée.</p>
        ${stay()}${breakdownHtml(b.q)}
        ${b.access.mode === 'confirmation' ? accessBlock() : `<p>Votre adresse et votre code d'accès vous seront envoyés le <b>${fmtDT(b.access.releaseAt)}</b>. Ils seront aussi visibles dans votre espace client à partir de ce moment.</p>`}
        <p class="small">Annulation ${POLICIES[l.policy].label.toLowerCase()} : ${esc(POLICIES[l.policy].text)}</p>
        <p>Un souci pendant le séjour ? Écrivez-nous depuis votre espace client ou par WhatsApp en rappelant votre référence.</p>${sig}`; break;
    case 'client_access':
      body = `<p>Bonjour ${esc(firstName(client.name))},</p><p>Votre arrivée approche. Voici les informations pour accéder au logement.</p>${stay()}${accessBlock()}${sig}`; break;
    case 'owner_confirmed': {
      const cl = cleaner(b.q.cleanerId);
      body = `<p>Bonjour ${esc(firstName(owner.name))},</p><p>Une réservation vient d'être confirmée et payée pour <b>${esc(l.title)}</b>.</p>
        <dl class="kv"><dt>Référence</dt><dd class="mono">${esc(b.ref)}</dd><dt>Dates</dt><dd>du ${fmtD(b.start)} au ${fmtD(b.end)} (${plural(b.q.qty, 'nuit')})</dd><dt>Voyageur</dt><dd>${esc(shortName(client.name))}, ${b.guests} pers.</dd>
        <dt>Hébergement (votre prix)</dt><dd class="num">${mad(b.q.ownerBase ?? b.q.base)}</dd><dt>Commission (${b.q.ratePct} %)</dt><dd class="num">− ${mad(b.q.commission)}</dd>${b.q.cleaning ? `<dt>Ménage${cl ? ' (' + esc(cl.name) + ')' : ''}</dt><dd class="num">− ${mad(b.q.cleaning)}</dd>` : ''}<dt>À vous verser</dt><dd class="num"><b>${mad(b.payout.amount)}</b>, prévu le ${fmtDT(b.payout.releaseAt)}</dd>
        <dt>Ménage</dt><dd>${cl ? esc(cl.name) + ' (prévenue par l\'équipe)' : 'Non programmé'}</dd></dl>
        <p class="small muted">Pour la sécurité des voyageurs, le code d'accès n'est jamais reproduit dans les e-mails adressés à l'équipe ou au propriétaire.</p>${sig}`; break;
    }
    case 'team_confirmed':
      body = `<p>Réservation confirmée et payée.</p>
        <dl class="kv"><dt>Référence</dt><dd class="mono">${esc(b.ref)}</dd><dt>Annonce</dt><dd>${esc(l.title)} (${esc(l.city)})</dd><dt>Propriétaire</dt><dd>${esc(owner.name)}</dd><dt>Client</dt><dd>${esc(client.name)} · ${esc(client.email)} · ${esc(client.phone)}</dd>
        <dt>Dates</dt><dd>du ${fmtD(b.start)} au ${fmtD(b.end)}, ${b.guests} pers.</dd><dt>Encaissé</dt><dd class="num">${mad(b.q.total)}</dd><dt>Prix propriétaire</dt><dd class="num">${mad(b.q.ownerBase ?? b.q.base)}</dd><dt>Revenu plateforme</dt><dd class="num">${mad((b.q.markup || 0) + b.q.serviceFee + b.q.commission)} (majoration ${b.q.markupPct ?? 0} % : ${mad(b.q.markup || 0)} · commission : ${mad(b.q.commission)}${b.q.serviceFee ? ' · frais de service : ' + mad(b.q.serviceFee) : ''})</dd>
        <dt>Versement propriétaire</dt><dd class="num">${mad(b.q.ownerPayout)} le ${fmtDT(b.payout ? b.payout.releaseAt : '')}</dd></dl>
        ${(b.extras || []).length ? `<p><b>Véhicules à préparer et livrer :</b> ${b.extras.map(x => `${esc(x.name)} du ${fmtD(x.start)} au ${fmtD(x.end)}`).join(' ; ')}.</p>` : ''}<p class="small muted">Adresse et code d'accès volontairement absents de cet e-mail.</p>`; break;
    case 'cancel_client': {
      const r = b.cancel.refund;
      body = `<p>Bonjour ${esc(firstName(client.name))},</p><p>Votre réservation <b>${esc(b.ref)}</b> pour ${esc(l.title)} est annulée.</p>
        <dl class="kv"><dt>Montant payé</dt><dd class="num">${mad(b.q.total)}</dd><dt>Remboursement</dt><dd class="num"><b>${mad(r.total)}</b></dd></dl><p class="small">${esc(r.note)} Le délai d'apparition sur votre relevé dépend de votre banque.</p>${sig}`; break;
    }
    case 'cancel_owner':
      body = `<p>Bonjour ${esc(firstName(owner.name))},</p><p>La réservation <b>${esc(b.ref)}</b> du ${fmtD(b.start)} au ${fmtD(b.end)} a été annulée. Les dates sont de nouveau disponibles.</p><p>Montant qui vous reste dû selon la politique d'annulation : <b>${mad(b.payout.amount)}</b>.</p>${sig}`; break;
    case 'cancel_team':
      body = `<p>Annulation de <b>${esc(b.ref)}</b> (${esc(l.title)}) par ${b.cancel.by === 'team' ? "l'équipe" : 'le client'}. Remboursement : ${mad(b.cancel.refund.total)}. Motif : ${esc(b.cancel.reason || '—')}.</p>`; break;
    case 'ticket_new': {
      const t = ticket(e.ticketId);
      body = t ? `<p>Nouvelle demande <b>${esc(t.ref)}</b> (${TICKET_TYPES[t.type]}) : ${esc(t.subject)}</p><p class="muted">À traiter depuis « Messagerie et réclamations ».</p>` : '<p>Demande supprimée.</p>'; break;
    }
    case 'ticket_msg': case 'ticket_reply': {
      const t = ticket(e.ticketId), to = user(e.toUserId);
      const last = t ? [...t.messages].reverse().find(m => !m.internal && m.by !== t.participantId && m.by !== 'guest') : null;
      body = t ? `<p>Bonjour ${esc(firstName(to ? to.name : (t.guest || {}).name))},</p><p>${e.kind === 'ticket_msg' ? "L'équipe vous a envoyé un message" : 'Notre équipe a répondu à votre demande'} <b>${esc(t.ref)}</b> : « ${esc(t.subject)} ».</p>
        ${last ? `<blockquote style="margin:0;padding:10px 14px;border-left:3px solid var(--line)">${esc(last.text).replace(/\n/g, '<br>')}</blockquote>` : ''}
        <p>${to ? 'Répondez depuis votre espace, rubrique « Messages et réclamations ».' : 'Répondez simplement à cet e-mail.'}</p>${sig}` : '<p>Demande supprimée.</p>'; break;
    }
    case 'invite': {
      const to = user(e.toUserId);
      body = `<p>Bonjour ${esc(firstName(to ? to.name : ''))},</p><p>Un compte <b>${esc((ROLE_LABEL[e.audience] || '').toLowerCase())}</b> vient d'être créé pour vous sur ${esc(st.siteName)}. Utilisez le lien d'activation pour définir votre mot de passe. Le lien expire au bout de 48 heures.</p><p class="small muted">Lien d'activation à usage unique, généré par le serveur en production.</p>${sig}`; break;
    }
    case 'request_new': {
      const r = S.requests.find(x => x.id === e.requestId);
      body = r ? `<p>Nouvelle demande propriétaire reçue par le formulaire du site.</p><dl class="kv"><dt>Nom</dt><dd>${esc(r.name)}</dd><dt>Ville</dt><dd>${esc(r.city)}</dd><dt>Bien</dt><dd>${esc(r.kind || '—')}</dd></dl>` : '<p>Demande supprimée.</p>'; break;
    }
    case 'info': body = `<p>${esc(e.text || '')}</p>${sig}`; break;
    default: body = '<p>—</p>';
  }
  return `<article class="email"><div class="eh"><b>${esc(e.subject)}</b><span>De : ${esc(st.siteName)} &lt;no-reply@douira.example&gt;</span><span>À : ${esc(e.toEmail)}</span><span>${emailSent(e) ? 'Envoyé le' : 'Programmé pour le'} ${fmtDT(e.at)}</span></div><div class="eb">${body}</div></article>`;
}
function inboxList(detailTab) {
  const u = me(); const list = S.emails.filter(e => e.toUserId === u.id && emailSent(e));
  return table(['Date', 'Objet'], list.map(e => `<tr class="click" data-act="go" data-to="space" data-tab="${detailTab}" data-id="${e.id}"><td class="num" style="white-space:nowrap">${fmtDT(e.at)}</td><td>${esc(e.subject)}</td></tr>`), 'Aucun e-mail reçu pour le moment.');
}
function emailDetail(p, backTab) {
  const e = S.emails.find(x => x.id === p.id), u = me();
  if (!e || (e.toUserId !== u.id && !can('emails.view'))) return '<div class="empty">E-mail introuvable.</div>';
  return `${back(backTab, 'Retour')}${emailHtml(e, u)}`;
}

/* ---------- Réclamations : composants communs ---------- */
function ticketModal(pre = {}) {
  const u = me(); let ctx = '';
  if (u.role === 'client') {
    const bs = S.bookings.filter(b => b.clientId === u.id && ['confirmed', 'cancelled'].includes(b.status));
    ctx = field('Réservation concernée', `<select name="bookingId" id="nt-b">${opt('', 'Aucune', pre.bookingId)}${bs.map(b => opt(b.id, b.ref + ' · ' + listing(b.listingId).title, pre.bookingId)).join('')}</select>`);
  } else if (u.role === 'owner') {
    const ls = S.listings.filter(l => l.ownerId === u.id);
    ctx = field('Bien concerné', `<select name="listingId" id="nt-l">${opt('', 'Aucun', pre.listingId)}${ls.map(l => opt(l.id, l.title, pre.listingId)).join('')}</select>`);
  }
  openModal(`<h2>Nouvelle demande</h2><form class="stack" data-form="newTicket">
    ${field('Type', `<select name="type" id="nt-type">${opt('question', 'Question', pre.type)}${opt('reclamation', 'Réclamation', pre.type)}${opt('probleme', 'Signaler un problème', pre.type)}</select>`)}
    ${ctx}${field('Objet', `<input name="subject" id="nt-subject" required value="${esc(pre.subject || '')}">`)}
    ${field('Message', `<textarea name="message" id="nt-msg" required>${esc(pre.message || '')}</textarea>`)}
    <div class="row"><button class="btn btn-p" type="submit">Envoyer</button><button type="button" class="btn btn-g" data-act="closeModal">Annuler</button></div></form>`);
}
function authorName(t, by) { return by === 'guest' ? ((t.guest || {}).name || 'Visiteur') + ' (visiteur)' : ((user(by) || {}).name || 'Utilisateur supprimé'); }
function threadHtml(t, team) {
  const u = me();
  return `<div class="thread">${t.messages.filter(m => team || !m.internal).map(m => {
    const au = user(m.by); const fromTeam = au && ['admin', 'collaborator'].includes(au.role);
    const label = fromTeam && !team ? `${firstName(au.name)} · équipe ${S.settings.siteName}` : authorName(t, m.by);
    return `<div class="msg${m.by === u.id ? ' me' : ''}${m.internal ? ' internal' : ''}"><div class="meta">${esc(label)} · ${fmtDT(m.at)}${m.internal ? ' · note interne, invisible pour le client ou le propriétaire' : ''}</div>${esc(m.text).replace(/\n/g, '<br>')}</div>`;
  }).join('')}</div>`;
}
function myTickets(detailTab) {
  const u = me(); const list = S.tickets.filter(t => t.participantId === u.id);
  return table(['Réf.', 'Objet', 'Type', 'Statut', 'Mise à jour'], list.map(t => `<tr class="click" data-act="go" data-to="space" data-tab="${detailTab}" data-id="${t.id}"><td class="mono">${esc(t.ref)}</td><td>${esc(t.subject)}</td><td>${TICKET_TYPES[t.type]}</td><td>${pill(TICKET_STATUS[t.status])}</td><td class="num">${fmtDT(t.updatedAt)}</td></tr>`), 'Aucune demande. Utilisez « Nouvelle demande » pour contacter l\'équipe.');
}
function myTicketDetail(p, backTab) {
  const t = ticket(p.id), u = me();
  if (!t || t.participantId !== u.id) return '<div class="empty">Demande introuvable.</div>';
  const b = t.bookingId ? booking(t.bookingId) : null, l = t.listingId ? listing(t.listingId) : null;
  return `${back(backTab, 'Mes demandes')}
    ${head(t.subject, `${esc(t.ref)} · ${TICKET_TYPES[t.type]}${b ? ' · réservation ' + esc(b.ref) : l ? ' · ' + esc(l.title) : ''}`, pill(TICKET_STATUS[t.status]))}
    <div class="panel stack">${threadHtml(t, false)}
      <form class="stack-s" data-form="reply" data-id="${t.id}">${field(t.status === 'resolue' || t.status === 'cloturee' ? 'Votre message (rouvre la demande)' : 'Votre réponse', '<textarea name="text" id="rp-text" required></textarea>')}
      <div class="row"><button class="btn btn-p" type="submit">Envoyer</button>${t.type === 'reclamation' && !t.escalated ? `<button type="button" class="btn btn-g" data-act="escalate" data-id="${t.id}">Demander l'escalade à la direction</button>` : ''}</div></form></div>`;
}

SPACE.c_bookings = () => {
  const u = me(); const list = S.bookings.filter(b => b.clientId === u.id && !(b.status === 'pending_payment' && new Date(b.holdUntil) < new Date()));
  return `${head('Mes réservations', '', `<button class="btn btn-p btn-s" data-act="go" data-to="search">Réserver un logement</button>`)}
    ${list.length ? `<div class="stack">${list.map(b => { const l = listing(b.listingId); return `<div class="panel row" style="gap:16px"><img class="thumb" src="${lphoto(l, 0)}" alt="">
      <div class="grow stack-s" style="gap:2px"><b>${esc(l.title)}</b><span class="small muted">${esc(b.ref)} · ${fmtD(b.start)} → ${fmtD(b.end)} · ${b.guests} pers. · ${mad(b.q.total)}</span></div>
      ${pill(displayStatus(b))}${reviewEligible(b, 'listing') ? reviewBtn(b, 'listing', 'Laisser un avis') : ''}${btnGo('Voir', 'space', { tab: 'c_booking', id: b.id })}</div>`; }).join('')}</div>` : '<div class="empty">Vous n\'avez pas encore de réservation.</div>'}`;
};
SPACE.c_booking = p => {
  const b = booking(p.id), u = me();
  if (!b || b.clientId !== u.id) return '<div class="empty">Réservation introuvable.</div>';
  const l = listing(b.listingId), acc = accessState(b), ds = displayStatus(b);
  const canCancel = b.status === 'confirmed' && new Date() < checkinDT(b);
  return `${back('c_bookings', 'Mes réservations')}
    ${p.ok ? `<div class="note ok"><b>Paiement confirmé.</b> Votre e-mail de confirmation vient d'être envoyé à ${esc(u.email)}. Il est aussi consultable dans « Mes e-mails ».</div>` : ''}
    ${head(l.title, `Réservation <span class="mono">${esc(b.ref)}</span> · ${esc(l.area)}, ${esc(l.city)}`, pill(ds))}
    <div class="split">
      <div class="stack">
        <div class="panel stack"><h3>Accès au logement</h3>
          ${acc.ok ? `<dl class="kv"><dt>Adresse</dt><dd>${esc(l.address)}</dd><dt>Localisation</dt><dd class="stack-s">${mapLinks(l, true)}</dd><dt>Code d'accès</dt><dd><span class="secret">${esc(l.accessCode)}</span></dd>${l.wifi ? `<dt>Wi-Fi</dt><dd>${esc(l.wifi)}</dd>` : ''}<dt>Horaires</dt><dd>Arrivée dès ${esc(l.checkIn)} · départ avant ${esc(l.checkOut)}</dd></dl><p class="small muted">Ces informations sont visibles par vous seul. Elles ne seront plus affichées après votre départ.</p>`
            : `<p class="muted">${esc(acc.why)}</p>`}</div>
        ${extrasSummary(b)}
        ${clientReviewPanel(b)}
        <div class="panel stack"><h3>Séjour</h3><dl class="kv"><dt>Arrivée</dt><dd>${fmtD(b.start)}</dd><dt>Départ</dt><dd>${fmtD(b.end)}</dd><dt>Voyageurs</dt><dd>${b.guests}</dd><dt>Annulation</dt><dd>${POLICIES[l.policy].label} : ${esc(POLICIES[l.policy].text)}</dd></dl></div>
        <div class="row">${b.status === 'pending_payment' ? btnGo('Finaliser le paiement', 'checkout', { id: b.id }, 'btn btn-p') : ''}${b.payment && b.payment.at && ['confirmed', 'cancelled'].includes(b.status) ? btnGo('Voir la facture', 'invoice', { id: b.id }, 'btn btn-g') : ''}
          <button class="btn btn-g" data-act="ticketNew" data-type="probleme" data-booking="${b.id}">Signaler un problème</button>
          <button class="btn btn-g" data-act="ticketNew" data-type="reclamation" data-booking="${b.id}">Déposer une réclamation</button>
          ${canCancel ? `<button class="btn btn-d" data-act="cancelAsk" data-id="${b.id}">Annuler la réservation</button>` : ''}</div>
      </div>
      <div class="panel stack"><h3>Paiement</h3>${breakdownHtml(b.q)}
        <dl class="kv small"><dt>Statut</dt><dd>${esc(b.payment.status)}</dd>${b.payment.ref ? `<dt>Référence</dt><dd class="mono">${esc(b.payment.ref)}</dd>` : ''}${b.payment.at ? `<dt>Date</dt><dd>${fmtDT(b.payment.at)}</dd>` : ''}${b.cancel ? `<dt>Remboursé</dt><dd class="num">${mad(b.cancel.refund.total)}</dd>` : ''}</dl></div>
    </div>`;
};
SPACE.c_inbox = () => `${head('Mes e-mails', 'Copie des e-mails envoyés à votre adresse. Les informations d\'accès y restent visibles pour vous seul, pendant la durée de validité du séjour.')}${inboxList('c_email')}`;
SPACE.c_email = p => emailDetail(p, 'c_inbox');
SPACE.c_tickets = () => `${head('Messages et réclamations', 'Questions, réclamations et problèmes signalés à l\'équipe.', '<button class="btn btn-p btn-s" data-act="ticketNew">Nouvelle demande</button>')}${myTickets('c_ticket')}`;
SPACE.c_ticket = p => myTicketDetail(p, 'c_tickets');
SPACE.c_profile = () => {

  return `${head('Mon profil')}

/* =====================================================================
   Espace propriétaire
   ===================================================================== */
const ownerListings = () => S.listings.filter(l => l.ownerId === me().id);
const ownerBookings = () => { const ids = ownerListings().map(l => l.id); return S.bookings.filter(b => ids.includes(b.listingId) && ['confirmed', 'cancelled'].includes(b.status)); };

SPACE.o_dash = () => {
  const ls = ownerListings(), bs = ownerBookings(), n = new Date();
  const upcoming = bs.filter(b => b.status === 'confirmed' && checkoutDT(b) > n).sort((a, b) => parseD(a.start) - parseD(b.start));
  const due = bs.filter(b => b.payout && b.payout.status === 'programmé').reduce((s, b) => s + b.payout.amount, 0);
  const paid = bs.filter(b => b.payout && b.payout.status === 'versé').reduce((s, b) => s + b.payout.amount, 0);
  return `${head('Bonjour ' + firstName(me().name), 'Vue d\'ensemble de vos biens et de vos revenus.', '<button class="btn btn-g btn-s" data-act="go" data-to="propose">Proposer un nouveau bien</button>')}
    <div class="kpis">${kpi('Biens publiés', `${ls.filter(l => l.status === 'published').length}<span class="muted" style="font-size:.6em"> / ${ls.length}</span>`)}${kpi('Séjours à venir', upcoming.length)}${kpi('Gains à venir', mad(due), 'Versés 24 h après chaque arrivée')}${kpi('Déjà versé', mad(paid))}</div>
    <div class="panel"><div class="panel-h"><h3>Prochaines arrivées</h3>${btnGo('Toutes les réservations', 'space', { tab: 'o_bookings' })}</div>
      ${table(['Réf.', 'Bien', 'Voyageur', 'Dates', '>Net pour vous'], upcoming.slice(0, 5).map(b => `<tr><td class="mono">${esc(b.ref)}</td><td>${esc(listing(b.listingId).title)}</td><td>${esc(shortName(user(b.clientId).name))}, ${b.guests} pers.</td><td class="num">${fmtD(b.start)} → ${fmtD(b.end)}</td><td class="r">${mad(b.payout.amount)}</td></tr>`), 'Aucune arrivée prévue.')}</div>`;
};
SPACE.o_props = () => `${head('Mes biens', 'Les annonces sont créées et publiées par l\'équipe. Demandez une modification depuis la fiche de chaque bien.')}

SPACE.t_dash = () => {
  const u = me(), n = new Date(), in7 = addDays(today(), 7);
  const newReq = S.requests.filter(r => r.status === 'nouvelle');
  const openT = S.tickets.filter(t => ['ouverte', 'en_cours'].includes(t.status));
  const conf = S.bookings.filter(b => b.status === 'confirmed');
  const arrivals = conf.filter(b => parseD(b.start) >= today() && parseD(b.start) <= in7).sort((a, b) => parseD(a.start) - parseD(b.start));
  const last30 = S.bookings.filter(b => b.payment && b.payment.at && new Date(b.payment.at) > addDays(n, -30) && ['confirmed', 'cancelled'].includes(b.status));
  const cash = last30.reduce((s, b) => s + b.q.total - (b.payment.refunded || 0), 0);
  const rev = last30.filter(b => b.status === 'confirmed').reduce((s, b) => s + (b.q.markup || 0) + b.q.serviceFee + b.q.commission, 0);
  const mine = u.role === 'collaborator' ? S.listings.filter(l => l.collaborators.includes(u.id)) : [];
  return `${head('Tableau de bord', `Bonjour ${esc(firstName(u.name))}. Voici ce qui demande votre attention.`)}
    <div class="kpis">${can('requests.manage') ? kpi('Demandes propriétaires', newReq.length, 'nouvelles') : ''}${can('tickets.manage') ? kpi('Demandes clients ouvertes', openT.length, openT.filter(t => t.priority === 'haute').length + ' prioritaires') : ''}
      ${can('bookings.view') ? kpi('Arrivées sous 7 jours', arrivals.length) : ''}${u.role === 'admin' ? kpi('Encaissé sur 30 jours', mad(cash), 'Revenu plateforme : ' + mad(rev)) : ''}</div>
    <div class="two">
      ${can('tickets.manage') ? `<div class="panel"><div class="panel-h"><h3>Réclamations et messages</h3>${btnGo('Tout voir', 'space', { tab: 't_tickets' })}</div>${table(['Réf.', 'Objet', 'Statut'], openT.slice(0, 5).map(t => `<tr class="click" data-act="go" data-to="space" data-tab="t_ticket" data-id="${t.id}"><td class="mono">${esc(t.ref)}</td><td>${esc(t.subject)}${t.priority === 'haute' ? ' <span class="pill bad">Prioritaire</span>' : ''}</td><td>${pill(TICKET_STATUS[t.status])}</td></tr>`), 'Rien en attente.')}</div>` : ''}
      ${can('requests.manage') ? `<div class="panel"><div class="panel-h"><h3>Nouvelles demandes propriétaires</h3>${btnGo('Tout voir', 'space', { tab: 't_requests' })}</div>${table(['Reçue', 'Source', 'Ville'], newReq.slice(0, 5).map(r => `<tr class="click" data-act="reqOpen" data-id="${r.id}"><td>${fmtDT(r.at)}</td><td>${REQ_SOURCE[r.source]}</td><td>${esc(r.name)} · ${esc(r.city)}</td></tr>`), 'Aucune nouvelle demande.')}</div>` : ''}
      ${can('bookings.view') ? `<div class="panel"><div class="panel-h"><h3>Prochaines arrivées</h3>${btnGo('Réservations', 'space', { tab: 't_bookings' })}</div>${table(['Date', 'Réf.', 'Logement'], arrivals.map(b => `<tr class="click" data-act="go" data-to="space" data-tab="t_booking" data-id="${b.id}"><td class="num">${fmtD(b.start)}</td><td class="mono">${esc(b.ref)}</td><td>${esc(listing(b.listingId).title)}</td></tr>`), 'Aucune arrivée dans les 7 jours.')}</div>` : ''}
      ${mine.length ? `<div class="panel"><div class="panel-h"><h3>Annonces dont vous êtes chargé</h3></div>${table(['Annonce', 'Statut'], mine.map(l => `<tr class="click" data-act="go" data-to="space" data-tab="t_listing" data-id="${l.id}"><td>${esc(l.title)}</td><td>${pill(LISTING_STATUS[l.status])}</td></tr>`), '')}</div>` : ''}
    </div>`;
};

function shareModal(l) {
